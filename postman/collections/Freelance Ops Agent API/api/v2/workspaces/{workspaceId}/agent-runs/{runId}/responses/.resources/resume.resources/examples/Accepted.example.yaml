$kind: http-example
request:
  url: "{{baseUrl}}/api/v2/workspaces/:workspaceId/agent-runs/:runId/responses"
  method: POST
  headers:
    - key: traceparent
      value: string
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    workspaceId: de2b5314-6e0a-8843-21c2-82105d14e423
    runId: de2b5314-6e0a-8843-21c2-82105d14e423
  body:
    type: json
    content: |-
      {
        "answers": [
          {
            "answer": "string",
            "questionIndex": 7628
          }
        ],
        "idempotencyKey": "stringstring",
        "interruptionId": "2b2a89e8-6516-e7b4-89ef-99f64208e2c4"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "runId": "1a9e7e44-ef2f-b38d-1471-8b0caa6efdf3",
        "status": "WAITING_FOR_USER",
        "acceptedAt": "1975-08-21T06:06:51.877Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "runId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "QUEUED",
              "RUNNING",
              "WAITING_FOR_USER",
              "COMPLETED",
              "PARTIAL",
              "FAILED",
              "CANCELLED"
            ]
          },
          "acceptedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
order: 1000
