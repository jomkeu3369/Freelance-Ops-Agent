  statusCode: 201
  statusText: Created
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "shareId": "0ddb121f-e5c7-7a52-a323-4de0918dd884",
        "token": "string",
        "publicPath": "string",
        "expiresAt": "1968-03-11T06:53:22.248Z",
        "createdAt": "1990-04-28T04:50:07.081Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "shareId": {
            "type": "string",
            "format": "uuid"
          },
          "token": {
            "type": "string"
          },
          "publicPath": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
order: 1000
