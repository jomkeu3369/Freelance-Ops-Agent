$kind: http-example
request:
  url: "{{baseUrl}}/api/v2/workspaces/:workspaceId/quotations/:quotationId/shares"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    workspaceId: de2b5314-6e0a-8843-21c2-82105d14e423
    quotationId: de2b5314-6e0a-8843-21c2-82105d14e423
  body:
    type: json
    content: |-
      {
        "expiresInDays": 28
      }
