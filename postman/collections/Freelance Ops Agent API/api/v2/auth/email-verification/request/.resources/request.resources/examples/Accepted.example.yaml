$kind: http-example
request:
  url: "{{baseUrl}}/api/v2/auth/email-verification/request"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "email": "MxPEFPuNjaU23zy@ULl.sep"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        }
      }
order: 1000
