$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/meta"
  method: GET
  headers:
    - key: Accept
      value: "*/*"
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "service": "string",
        "version": "string",
        "status": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "service": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "status": {
            "type": "string"
          }
        }
      }
order: 2000
