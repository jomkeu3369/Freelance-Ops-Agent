name: freelance-ops-v2-infra

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelance_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_postgres_password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local_app_password}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_password}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_ops"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    name: freelance-ops-v2-internal
    driver: bridge

volumes:
  postgres_v2_data:
    name: freelance-ops-v2-postgres-data
