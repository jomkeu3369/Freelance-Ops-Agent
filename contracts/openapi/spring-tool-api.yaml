openapi: 3.1.0
info:
  title: Freelance Ops Spring Internal Tool API
  version: 0.3.0
  description: Python Agent가 Spring Boot의 업무 기능을 호출하는 내부 API 계약이다.
servers:
  - url: http://backend:8080
    description: Docker 내부 네트워크 주소. 호출에는 별도 인증이 필요하다.
security:
  - delegationToken: []
paths:
  /internal/v1/pet-generations/{generationId}/usage:
    post:
      operationId: recordPixelPetUsage
      description: >-
        모델 호출 전후의 시도와 최종 사용량을 기록한다. 생성 ID는 위임 실행과 X-Run-Id,
        사용자·작업 공간·프로젝트·서버 모델·금액 예약에 일치해야 한다.
        agent.run과 project.read가 필요하며 호출 시도는 하나만 접수한다.
        불명확한 사용량의 예약은 유지하고 같은 보고의 재전송은 중복 정산하지 않는다.
      parameters:
        - $ref: "#/components/parameters/GenerationId"
        - $ref: "#/components/parameters/RunIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PixelPetUsage"
      responses:
        "200":
          description: 사용량을 영속 기록했다. 응답 본문은 없으며 캐시하지 않는다.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/pet-generations/{generationId}/complete:
    post:
      operationId: completePixelPetGeneration
      description: >-
        Agent의 HTTP 응답 전에 픽셀 외형과 사용량을 저장한다. usage와 같은 위임·예약 경계를
        검사한다. 서버가 원래 입력과 이전 요청 이력을 결합하며 클라이언트 외형을 신뢰하지 않는다.
        같은 결과의 재전송은 허용하고 다른 결과로 바꾸려는 요청은 거부한다.
      parameters:
        - $ref: "#/components/parameters/GenerationId"
        - $ref: "#/components/parameters/RunIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PixelPetCompletion"
      responses:
        "200":
          description: 생성 결과를 저장했다. 사용자 저장·선택은 별도 공개 API에서 수행한다.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/byok-executions/{scopeId}/attempts:
    post:
      operationId: admitByokProviderAttempt
      description:
        개인 키 조회·모델 호출 전에 BYOK 실행 범위에서 호출 1회와 보수적인 입출력 토큰을 원자적으로 예약한다. 유효한 실행 위임과 선택한 개인 키가 필요하며
        실행·작업 공간·프로젝트·사용자·모델·추론 수준·비용 출처·서비스 등급이 일치해야 한다. 재시도마다 새 callId를 사용하고 중복 ID는 거부한다. 예약은 환급하지 않으며 응답
        유실·불명확한 결과는 실패로 닫고 무작정 재시도하지 않는다. 닫힘·만료·취소·누락·위조·과거 형식의 범위로는 새 작업을 접수할 수 없다.
      parameters:
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/RunIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ByokAttempt"
      responses:
        "200":
          description: "호출 시도 1건의 예약을 영속 저장했다. 응답은 캐시하지 않는다(Cache-Control: no-store)."
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByokAdmission"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "410":
          description: 최초에 확정한 실행 범위의 만료 시각을 지났다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByokAdmissionError"
        "429":
          description: 실행에 고정된 보수적 호출·토큰 한도를 소진했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByokAdmissionError"
        "409":
          description: 범위 연결이 일치하지 않거나 범위가 닫힘·일시정지 상태 또는 중복 시도다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ByokAdmissionError"
  /internal/v1/ai-connections/{id}/credential:
    get:
      operationId: resolvePersonalCredential
      description:
        현재 위임 권한·소유자·작업 공간·프로젝트·모델을 활성 BYOK 실행 범위와 다시 대조한다. 과거 형식이거나 실행 ID가 없으면 키를 조회할 수 없다. 응답은
        해당 호출에서만 사용하며 도구 실행 기록이나 저장소에 남기지 않는다.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum:
              - OPENAI
              - GEMINI
        - name: model
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/RunIdHeader"
      responses:
        "200":
          description: "해당 호출에서만 사용할 키. 응답은 캐시하지 않는다(Cache-Control: no-store)."
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - apiKey
                properties:
                  apiKey:
                    type: string
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/projects/{projectId}/context:
    get:
      operationId: getProjectContext
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/RunIdHeader"
      responses:
        "200":
          description: 위임된 작업 공간에 속한 프로젝트 맥락
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectContext"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/domain-packs/{domainCode}:
    get:
      operationId: getDomainPack
      parameters:
        - name: domainCode
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 64
        - $ref: "#/components/parameters/RunIdHeader"
      responses:
        "200":
          description: 버전이 지정된 도메인 팩
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainPack"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/requirements/validate:
    post:
      operationId: validateRequirementDraft
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementDraft"
      responses:
        "200":
          description: 정해진 규칙으로 검증한 요구사항 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementValidationResult"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/quotes/calculate:
    post:
      operationId: calculateQuote
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCalculationRequest"
      responses:
        "200":
          description: 정해진 계산 규칙으로 산출한 견적 합계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteCalculationResult"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/knowledge/search:
    post:
      operationId: searchKnowledge
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
      responses:
        "200":
          description: 위임된 작업 공간의 키워드·벡터 결합 검색 결과
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSearchResult"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
components:
  securitySchemes:
    delegationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunIdHeader:
      name: X-Run-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: RFC 9457 형식의 오류 응답
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    PixelPetUsage:
      $ref: ./agent/execution-policy.yaml#/schemas/AgentRunUsage
    PixelPetCompletion:
      $ref: ./agent/pets.yaml#/schemas/GeneratePixelPetResponse
    ByokAttempt:
      $ref: ./spring/byok-executions.yaml#/schemas/ByokAttempt
    ByokAdmission:
      $ref: ./spring/byok-executions.yaml#/schemas/ByokAdmission
    ByokAdmissionError:
      $ref: ./spring/byok-executions.yaml#/schemas/ByokAdmissionError
    ProjectContext:
      $ref: ./spring/project-context.yaml#/schemas/ProjectContext
    MemorySourceMessage:
      $ref: ./spring/project-context.yaml#/schemas/MemorySourceMessage
    DomainPack:
      $ref: ./spring/domain-packs.yaml#/schemas/DomainPack
    DomainPackSourceReference:
      $ref: ./spring/domain-packs.yaml#/schemas/DomainPackSourceReference
    RequirementDraft:
      $ref: ./spring/requirements.yaml#/schemas/RequirementDraft
    RequirementValidationResult:
      $ref: ./spring/requirements.yaml#/schemas/RequirementValidationResult
    QuoteCalculationRequest:
      $ref: ./spring/quotations.yaml#/schemas/QuoteCalculationRequest
    QuoteCalculationItem:
      $ref: ./spring/quotations.yaml#/schemas/QuoteCalculationItem
    QuoteCalculationResult:
      $ref: ./spring/quotations.yaml#/schemas/QuoteCalculationResult
    KnowledgeSearchRequest:
      $ref: ./spring/knowledge-search.yaml#/schemas/KnowledgeSearchRequest
    KnowledgeSearchResult:
      $ref: ./spring/knowledge-search.yaml#/schemas/KnowledgeSearchResult
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
