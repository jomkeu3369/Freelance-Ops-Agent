schemas:
  AttachmentText:
    type: object
    additionalProperties: false
    required:
      - name
      - mediaType
      - size
      - sha256
      - status
      - text
      - notice
      - units
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 180
      mediaType:
        type: string
        maxLength: 100
      size:
        type: integer
        minimum: 1
        maximum: 2097152
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      status:
        type: string
        enum:
          - COMPLETE
          - PARTIAL
          - UNSUPPORTED
      text:
        type: string
        maxLength: 40000
      notice:
        type: string
        maxLength: 1000
      encoding:
        type:
          - string
          - "null"
      delimiter:
        type:
          - string
          - "null"
      units:
        type: integer
        minimum: 1
        maximum: 5000
      ocrLanguage:
        type: string
        enum:
          - mixed
          - ko
          - en
        default: mixed
      ocrLayout:
        type: string
        enum:
          - general
          - singleblock
        default: general
      coverage:
        type: array
        maxItems: 60
        default: []
        description:
          페이지·프레임 순서대로 기록한다. 텍스트·CSV와 구조화된 범위 정보가 없는 과거 결과는 빈 배열이다. OCR 시도에는 읽기 실패도 포함한다. 완료는 결과가
          반환된 경우를 뜻하며 추출 텍스트는 비어 있을 수 있다.
        items:
          $ref: "#/schemas/AttachmentCoverage"
  AttachmentCoverage:
    type: object
    additionalProperties: false
    required:
      - index
      - kind
      - nativeStatus
      - rasterStatus
      - ocrAttempted
      - ocrCompleted
      - ocrStatus
      - reason
    properties:
      index:
        type: integer
        minimum: 1
        maximum: 60
      kind:
        type: string
        enum:
          - PAGE
          - FRAME
      nativeStatus:
        type: string
        enum:
          - TEXT
          - EMPTY
          - FAILED
          - NOT_APPLICABLE
      rasterStatus:
        type: string
        enum:
          - NONE
          - SMALL
          - LARGE
          - UNKNOWN
          - NOT_APPLICABLE
      ocrAttempted:
        type: boolean
      ocrCompleted:
        type: boolean
      ocrStatus:
        type: string
        enum:
          - READ
          - EMPTY
          - FAILED
          - SKIPPED
      reason:
        type: string
        enum:
          - TEXT_ONLY
          - SMALL_RASTER
          - SAMPLED_OUT
          - BUDGET_EXHAUSTED
          - TOOL_UNAVAILABLE
          - LANGUAGE_UNAVAILABLE
          - TOOL_FAILED
          - EMPTY_RESULT
          - TEXT_FOUND
          - DUPLICATE_ONLY
