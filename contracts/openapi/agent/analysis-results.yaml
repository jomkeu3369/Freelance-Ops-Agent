schemas:
  DepartmentName:
    type: string
    enum:
      - REQUIREMENTS
      - RESEARCH
      - DEAL_DESIGN
      - VERIFICATION
  SourceReference:
    type: object
    additionalProperties: false
    required:
      - title
      - url
      - provider
      - contentSha256
      - fetchedAt
      - authorityLevel
      - excerpt
    properties:
      title:
        type: string
        maxLength: 500
      url:
        type: string
        format: uri
        maxLength: 2048
      provider:
        type: string
        maxLength: 50
      contentSha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      fetchedAt:
        type: string
        format: date-time
      authorityLevel:
        type: string
        maxLength: 50
      jurisdiction:
        type: string
        maxLength: 32
      excerpt:
        type: string
        minLength: 1
        maxLength: 4000
  DepartmentResult:
    type: object
    additionalProperties: false
    required:
      - department
      - status
      - summary
      - evidenceIds
      - assumptionIds
      - sources
    properties:
      department:
        $ref: "#/schemas/DepartmentName"
      status:
        type: string
        enum:
          - COMPLETED
          - PARTIAL
          - FAILED
          - SKIPPED
      summary:
        type: string
        maxLength: 10000
      evidenceIds:
        type: array
        items:
          type: string
          format: uuid
      assumptionIds:
        type: array
        items:
          type: string
          format: uuid
      sources:
        type: array
        maxItems: 10
        items:
          $ref: "#/schemas/SourceReference"
      errorCode:
        type: string
        maxLength: 100
  AgentRunResult:
    type: object
    additionalProperties: false
    required:
      - projectSummary
      - openQuestions
      - departmentResults
      - quotationDraft
      - quotationDrafts
    properties:
      projectSummary:
        type: string
        maxLength: 10000
      openQuestions:
        type: array
        items:
          type: string
          maxLength: 1000
      departmentResults:
        type: array
        maxItems: 4
        items:
          $ref: "#/schemas/DepartmentResult"
      quotationDraft:
        oneOf:
          - $ref: "#/schemas/QuotationDraft"
          - type: "null"
        description: RECOMMENDED 초안을 반환하는 이전 형식의 호환 필드다.
      quotationDrafts:
        type: array
        maxItems: 3
        description: 범위와 공수가 다른 LEAN·RECOMMENDED·EXPANDED AI 견적 초안
        items:
          $ref: "#/schemas/QuotationDraft"
      referencedDocumentIds:
        type: array
        maxItems: 50
        description: 실행기가 실제로 제공한 확정 문서 ID다. 모델이 임의로 만든 ID는 포함하지 않는다.
        items:
          type: string
          format: uuid
  QuotationDraft:
    type: object
    additionalProperties: false
    required:
      - scenario
      - items
    properties:
      petPerspective:
        anyOf:
          - $ref: "#/schemas/PetPerspective"
          - type: "null"
      scenario:
        type: string
        enum:
          - LEAN
          - RECOMMENDED
          - EXPANDED
      items:
        type: array
        minItems: 1
        maxItems: 50
        items:
          $ref: "#/schemas/QuotationDraftItem"
  PetPerspective:
    type: object
    additionalProperties: false
    required:
      - proposal
      - rationale
      - tradeoff
    properties:
      proposal:
        type: string
        minLength: 1
        maxLength: 600
      rationale:
        type: string
        minLength: 1
        maxLength: 1000
      tradeoff:
        type: string
        minLength: 1
        maxLength: 600
  QuotationDraftItem:
    type: object
    additionalProperties: false
    required:
      - title
      - description
      - quantity
      - unit
      - rateCardHint
      - basis
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
      description:
        type: string
        maxLength: 5000
      quantity:
        type: number
        exclusiveMinimum: 0
      unit:
        type: string
        enum:
          - HOUR
          - DAY
          - FIXED
      rateCardHint:
        type:
          - string
          - "null"
        maxLength: 200
      basis:
        $ref: "#/schemas/QuotationDraftBasis"
  QuotationDraftBasis:
    type: object
    additionalProperties: false
    required:
      - type
      - content
      - sourceReference
      - sourceTitle
    properties:
      type:
        type: string
        enum:
          - ASSUMPTION
          - EVIDENCE
      content:
        type: string
        minLength: 1
        maxLength: 3000
      sourceReference:
        type:
          - string
          - "null"
        maxLength: 2048
      sourceTitle:
        type:
          - string
          - "null"
        maxLength: 300
