schemas:
  RaptorBuildRequest:
    type: object
    additionalProperties: false
    required:
      - context
      - provider
      - embeddingModel
      - summaryModel
      - chunks
    properties:
      context:
        type: object
        additionalProperties: false
        required:
          - runId
          - workspaceId
          - projectId
          - snapshotId
        properties:
          runId:
            type: string
            format: uuid
          workspaceId:
            type: string
            format: uuid
          projectId:
            type: string
            format: uuid
          snapshotId:
            type: string
            format: uuid
      provider:
        type: string
        enum:
          - OPENAI
      embeddingModel:
        type: string
        minLength: 1
        maxLength: 100
      summaryModel:
        type: string
        minLength: 1
        maxLength: 100
      chunks:
        type: array
        minItems: 1
        maxItems: 500
        items:
          $ref: "#/schemas/RaptorSourceChunk"
      options:
        $ref: "#/schemas/RaptorBuildOptions"
  RaptorSourceChunk:
    type: object
    additionalProperties: false
    required:
      - chunkId
      - documentId
      - text
    properties:
      chunkId:
        type: string
        format: uuid
      documentId:
        type: string
        format: uuid
      text:
        type: string
        minLength: 1
        maxLength: 20000
      metadata:
        type: object
        additionalProperties:
          type: string
  RaptorBuildOptions:
    type: object
    additionalProperties: false
    properties:
      targetClusterSize:
        type: integer
        minimum: 2
        maximum: 50
        default: 4
      maxSummaryLevels:
        type: integer
        minimum: 1
        maximum: 8
        default: 4
      kmeansIterations:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  RaptorBuildResponse:
    type: object
    additionalProperties: false
    required:
      - workspaceId
      - snapshotId
      - embeddingModel
      - summaryModel
      - nodes
      - rootIds
    properties:
      workspaceId:
        type: string
        format: uuid
      snapshotId:
        type: string
        format: uuid
      embeddingModel:
        type: string
      summaryModel:
        type: string
      nodes:
        type: array
        items:
          $ref: "#/schemas/RaptorNode"
      rootIds:
        type: array
        items:
          type: string
          format: uuid
  RaptorNode:
    type: object
    additionalProperties: false
    required:
      - nodeId
      - kind
      - level
      - text
      - embedding
      - childIds
      - metadata
    properties:
      nodeId:
        type: string
        format: uuid
      kind:
        type: string
        enum:
          - LEAF
          - SUMMARY
      level:
        type: integer
        minimum: 0
      text:
        type: string
      embedding:
        type: array
        minItems: 1
        items:
          type: number
      childIds:
        type: array
        items:
          type: string
          format: uuid
      sourceChunkId:
        type: string
        format: uuid
      documentId:
        type: string
        format: uuid
      metadata:
        type: object
        additionalProperties:
          type: string
