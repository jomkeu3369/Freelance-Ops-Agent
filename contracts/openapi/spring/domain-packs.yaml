schemas:
  DomainPack:
    type: object
    additionalProperties: false
    required:
      - code
      - version
      - jurisdictionCode
      - professionCode
      - scope
      - requiredFields
      - questionTemplates
      - sourceReferences
      - effectiveFrom
      - effectiveUntil
    properties:
      code:
        type: string
      version:
        type: string
      jurisdictionCode:
        type: string
      professionCode:
        type: string
      scope:
        type: string
      requiredFields:
        type: array
        items:
          type: string
      questionTemplates:
        type: array
        items:
          type: string
      sourceReferences:
        type: array
        items:
          $ref: "#/schemas/DomainPackSourceReference"
      effectiveFrom:
        type: string
        format: date
      effectiveUntil:
        type:
          - string
          - "null"
        format: date
  DomainPackSourceReference:
    type: object
    additionalProperties: false
    required:
      - title
      - url
    properties:
      title:
        type: string
      url:
        type: string
        format: uri
