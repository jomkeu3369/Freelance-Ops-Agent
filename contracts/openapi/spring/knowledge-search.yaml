schemas:
  KnowledgeSearchRequest:
    type: object
    additionalProperties: false
    required:
      - query
      - limit
    properties:
      query:
        type: string
        minLength: 1
        maxLength: 2000
      embedding:
        type: array
        minItems: 1536
        maxItems: 1536
        items:
          type: number
          format: float
      limit:
        type: integer
        minimum: 1
        maximum: 50
      embeddingModel:
        type:
          - string
          - "null"
        maxLength: 120
        description: 임베딩을 전달할 때 필수이며 색인에 사용한 모델과 일치해야 한다.
  KnowledgeSearchResult:
    type: object
    additionalProperties: false
    required:
      - chunkId
      - documentId
      - documentTitle
      - sourceType
      - content
      - rrfScore
      - keywordRank
    properties:
      chunkId:
        type: string
        format: uuid
      documentId:
        type: string
        format: uuid
      documentTitle:
        type: string
        maxLength: 300
      sourceType:
        type: string
        enum:
          - PAST_PROJECT
          - POLICY
          - PLATFORM_TERMS
          - USER_TEMPLATE
          - EXTERNAL_SOURCE
      sourceUri:
        type: string
        maxLength: 2000
      sourceVersion:
        type: string
        maxLength: 120
      jurisdiction:
        type: string
        maxLength: 120
      effectiveFrom:
        type: string
        format: date
      effectiveUntil:
        type: string
        format: date
      content:
        type: string
        maxLength: 20000
      rrfScore:
        type: number
      keywordRank:
        type: integer
        minimum: 0
      vectorRank:
        type: integer
        minimum: 1
      origin:
        type: string
        enum:
          - user
          - agent
          - external
      memoryType:
        type: string
        enum:
          - requirement
          - decision
          - summary
          - assumption
          - response
          - reference
      confirmationStatus:
        type: string
        enum:
          - confirmed
          - unconfirmed
          - superseded
      projectId:
        type:
          - string
          - "null"
        format: uuid
      revisionNumber:
        type: integer
        minimum: 1
      sourceMessages:
        type: array
        items:
          $ref: project-context.yaml#/schemas/MemorySourceMessage
