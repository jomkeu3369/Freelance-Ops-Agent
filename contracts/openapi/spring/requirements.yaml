schemas:
  RequirementDraft:
    type: object
    additionalProperties: false
    required:
      - projectId
      - summary
      - features
      - constraints
      - assumptions
      - openQuestions
    properties:
      projectId:
        type: string
        format: uuid
      summary:
        type: string
        maxLength: 10000
      features:
        type: array
        items:
          type: string
          maxLength: 1000
      constraints:
        type: array
        items:
          type: string
          maxLength: 1000
      assumptions:
        type: array
        items:
          type: string
          maxLength: 1000
      openQuestions:
        type: array
        items:
          type: string
          maxLength: 1000
  RequirementValidationResult:
    type: object
    additionalProperties: false
    required:
      - valid
      - errors
      - warnings
    properties:
      valid:
        type: boolean
      errors:
        type: array
        items:
          type: string
      warnings:
        type: array
        items:
          type: string
