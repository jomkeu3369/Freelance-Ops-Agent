openapi: 3.1.0
info:
  title: Freelance Ops Agent Internal API
  version: 0.7.0
  description: Spring Boot가 Agent 실행을 시작·조회·제어하는 내부 API 계약이다.
servers:
  - url: http://agent:8000
    description: Docker 내부 네트워크 주소. 호출에는 별도 인증이 필요하다.
tags:
  - name: Health
  - name: AgentRuns
  - name: AgentTaskCommands
  - name: QuotationAssumptions
  - name: Raptor
  - name: AIPlatform
paths:
  /internal/v1/attachments/extract:
    post:
      tags:
        - Attachments
      operationId: extractChatAttachment
      security:
        - delegationToken: []
      description:
        인증된 요청에 한해 로컬에서 추출한다. 원본은 최대 2 MiB, 처리 시간은 15초, 동시 추출은 2건으로 제한한다. OCR 결과는 부분 추출(PARTIAL)로
        표시하며 외부 모델을 호출하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - context
                - file
              properties:
                context:
                  $ref: "#/components/schemas/TrustedRunContext"
                file:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - mediaType
                    - base64
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 180
                    mediaType:
                      type: string
                      maxLength: 100
                    base64:
                      type: string
                      minLength: 1
                      maxLength: 2796204
                    encoding:
                      type: string
                      maxLength: 10
                      default: auto
                    delimiter:
                      type: string
                      maxLength: 4
                      default: auto
                    ocrLanguage:
                      type: string
                      enum:
                        - mixed
                        - ko
                        - en
                      default: mixed
                    ocrLayout:
                      type: string
                      enum:
                        - general
                        - singleblock
                      default: general
      responses:
        "200":
          description: 추출 범위와 처리 한도를 함께 표시한 텍스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentText"
        "400":
          description: 실행 맥락이나 파일 요청이 올바르지 않다.
        "401":
          description: 위임 토큰이 필요하다.
        "403":
          description: 위임 권한이나 프로젝트 범위가 일치하지 않는다.
        "413":
          description: 입력 또는 출력 한도를 초과했다.
        "422":
          description: 파일 형식, 추출 실패, 시간 초과 또는 파서 자원 제한으로 처리할 수 없다.
        "429":
          description: 동시 추출 한도에 도달했다.
  /internal/v1/pets/generate:
    post:
      tags:
        - Pets
      operationId: generatePetProfile
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePetRequest"
      responses:
        "409":
          description: 독립 호출의 비용 예약 절차가 마련되지 않아 현재는 모델 제공사에 요청하기 전에 409로 거부한다. 아래 성공 응답은 기존 계약 호환을 위해 보존한다.
        "200":
          description: 기존 생성 응답 형식. 검토용 프로필이며 저장하지 않는다. 호출 1회·출력 1,000토큰·30초 한도를 사용한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePetResponse"
        "403":
          description: 위임 범위가 일치하지 않는다.
        "502":
          description: 생성에 실패했다. 다른 모델이나 키로 자동 전환하지 않는다.
        "503":
          description: AI Gateway를 사용할 수 없다.
  /internal/v1/pets/generate-pixel:
    post:
      tags: [Pets]
      operationId: generatePixelPet
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePixelPetRequest"
      responses:
        "200":
          description: 생성된 픽셀 외형과 사용량. 호출 전후 사용량과 결과를 Spring에 영속화한다. 호출 1회·출력 4096토큰·전체 60초·USD 0.10 예약 상한을 적용한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePixelPetResponse"
        "403":
          description: 위임 범위 또는 금액·호출 상한이 일치하지 않는다.
        "502":
          description: 생성 또는 결과 보관에 실패했다. 모델을 재시도하거나 프리셋으로 대체하지 않는다.
        "503":
          description: AI Gateway를 사용할 수 없다.
  /health:
    get:
      tags:
        - Health
      operationId: getAgentHealth
      responses:
        "200":
          description: Agent 프로세스가 응답한다. DB 등 의존 서비스의 준비 상태는 별도로 확인한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/readiness:
    get:
      tags:
        - Health
      operationId: getAgentReadiness
      responses:
        "200":
          description: 실행기 초기화가 끝났고 설정된 DB에 접근할 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 초기화·종료 중이거나 필수 DB에 접근할 수 없다. 본문의 status는 DOWN이다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/v1/agent-runs:
    post:
      tags:
        - AgentRuns
      operationId: startAgentRun
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunRequest"
      responses:
        "202":
          description: 실행 요청을 접수했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}:
    get:
      tags:
        - AgentRuns
      operationId: getAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 외부에 공개할 수 있는 현재 실행 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/resume:
    post:
      tags:
        - AgentRuns
      operationId: resumeAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeAgentRunRequest"
      responses:
        "202":
          description: 재개 요청을 접수했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/events:
    get:
      tags:
        - AgentRuns
      operationId: streamAgentRunEvents
      description: 실행 이벤트를 순서대로 SSE로 전송한다. 재연결 시 마지막 이벤트 ID부터 이어 받을 수 있다.
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: 실행 순서에 따른 Agent 이벤트 스트림
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/route-observations:
    get:
      tags:
        - AgentRuns
      operationId: getRouteObservations
      description: 저장된 route.selected 이벤트를 커서 기준으로 조회한다. 스트림이 아닌 개수 제한이 있는 응답이다.
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: After-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: 지정한 커서 이후의 라우팅 기록. 최대 100건을 반환한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteObservationBatch"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/cancel:
    post:
      tags:
        - AgentRuns
      operationId: cancelAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 취소된 실행 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/task-commands:
    post:
      tags:
        - AgentTaskCommands
      operationId: acceptAgentTaskCommand
      description: 대상 리비전을 확인한 작업 제어 명령 1건을 영속 저장한다.
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskCommand"
      responses:
        "202":
          description: 명령을 영속 저장했거나 같은 요청의 기존 접수 결과를 반환했다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskCommandAcceptance"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/quotation-assumptions/suggest:
    post:
      tags:
        - QuotationAssumptions
      operationId: suggestQuotationAssumption
      description: 견적 수량·금액을 바꾸지 않고 검토용 가정 문장 1개를 제안하는 기존 계약이다. 현재는 독립 유료 호출을 차단한다.
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumptionSuggestionRequest"
      responses:
        "409":
          description: 독립 호출의 비용 예약 절차가 마련되지 않아 현재는 모델 제공사에 요청하기 전에 409로 거부한다. 아래 성공 응답은 기존 계약 호환을 위해 보존한다.
        "200":
          description: 기존 성공 응답 형식인 검토용 가정 문장
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumptionSuggestionResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/raptor/build:
    post:
      tags:
        - Raptor
      operationId: buildRaptorIndex
      description: Spring에서 저장·공개할 RAPTOR 노드를 만드는 기존 계약이다. 저장소 구현에 의존하지 않으며 현재는 독립 유료 호출을 차단한다.
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaptorBuildRequest"
      responses:
        "409":
          description: 독립 호출의 비용 예약 절차가 마련되지 않아 현재는 모델 제공사에 요청하기 전에 409로 거부한다. 아래 성공 응답은 기존 계약 호환을 위해 보존한다.
        "200":
          description: Spring에서 저장할 RAPTOR 노드의 기존 성공 응답 형식
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaptorBuildResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/platform/metrics:
    get:
      tags:
        - AIPlatform
      operationId: getAiGatewayMetrics
      description: 내부 Prometheus 수집기에 AI Gateway 지표를 제공한다. 프롬프트 내용은 포함하지 않는다.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus 텍스트 형식의 지표
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
components:
  securitySchemes:
    delegationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    metricsToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 운영 설정으로 주입하는 지표 수집 전용 Bearer 토큰. 실행 위임 JWT와 구분한다.
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: RFC 9457 형식의 오류 응답
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        service:
          type: string
          const: agent
        version:
          type: string
    TrustedRunContext:
      $ref: ./agent/execution-policy.yaml#/schemas/TrustedRunContext
    RunBudget:
      $ref: ./agent/execution-policy.yaml#/schemas/RunBudget
    ModelSelection:
      $ref: ./agent/execution-policy.yaml#/schemas/ModelSelection
    AssumptionSuggestionRequest:
      $ref: ./agent/quotation-assumptions.yaml#/schemas/AssumptionSuggestionRequest
    AssumptionSuggestionResponse:
      $ref: ./agent/quotation-assumptions.yaml#/schemas/AssumptionSuggestionResponse
    AssumptionSuggestionUsage:
      $ref: ./agent/quotation-assumptions.yaml#/schemas/AssumptionSuggestionUsage
    PlatformBudget:
      $ref: ./agent/execution-policy.yaml#/schemas/PlatformBudget
    ByokBudget:
      $ref: ./agent/execution-policy.yaml#/schemas/ByokBudget
    AgentRunRequest:
      $ref: ./agent/run-requests.yaml#/schemas/AgentRunRequest
    ClarificationAnswer:
      $ref: ./agent/run-requests.yaml#/schemas/ClarificationAnswer
    SafetyContext:
      $ref: ./agent/run-requests.yaml#/schemas/SafetyContext
    AgentRunAccepted:
      $ref: ./agent/run-state.yaml#/schemas/AgentRunAccepted
    AgentTaskCommand:
      $ref: ./agent/task-commands.yaml#/schemas/AgentTaskCommand
    AgentTaskCommandAcceptance:
      $ref: ./agent/task-commands.yaml#/schemas/AgentTaskCommandAcceptance
    AgentRunStatus:
      $ref: ./agent/run-state.yaml#/schemas/AgentRunStatus
    AgentRunEvent:
      $ref: ./agent/run-state.yaml#/schemas/AgentRunEvent
    RouteObservationBatch:
      $ref: ./agent/run-state.yaml#/schemas/RouteObservationBatch
    DepartmentName:
      $ref: ./agent/analysis-results.yaml#/schemas/DepartmentName
    SourceReference:
      $ref: ./agent/analysis-results.yaml#/schemas/SourceReference
    DepartmentResult:
      $ref: ./agent/analysis-results.yaml#/schemas/DepartmentResult
    AgentRunResult:
      $ref: ./agent/analysis-results.yaml#/schemas/AgentRunResult
    QuotationDraft:
      $ref: ./agent/analysis-results.yaml#/schemas/QuotationDraft
    PetPerspective:
      $ref: ./agent/analysis-results.yaml#/schemas/PetPerspective
    QuotationDraftItem:
      $ref: ./agent/analysis-results.yaml#/schemas/QuotationDraftItem
    QuotationDraftBasis:
      $ref: ./agent/analysis-results.yaml#/schemas/QuotationDraftBasis
    AgentRunView:
      $ref: ./agent/run-state.yaml#/schemas/AgentRunView
    AttachmentText:
      $ref: ./agent/attachments.yaml#/schemas/AttachmentText
    AttachmentCoverage:
      $ref: ./agent/attachments.yaml#/schemas/AttachmentCoverage
    SkillSelection:
      $ref: ./agent/run-requests.yaml#/schemas/SkillSelection
    AgentRunMetadata:
      $ref: ./agent/run-state.yaml#/schemas/AgentRunMetadata
    ProviderCallUsage:
      $ref: ./agent/execution-policy.yaml#/schemas/ProviderCallUsage
    ExternalToolCallUsage:
      $ref: ./agent/execution-policy.yaml#/schemas/ExternalToolCallUsage
    AgentRunUsage:
      $ref: ./agent/execution-policy.yaml#/schemas/AgentRunUsage
    AgentInterruption:
      $ref: ./agent/run-state.yaml#/schemas/AgentInterruption
    ResumeAgentRunRequest:
      $ref: ./agent/run-requests.yaml#/schemas/ResumeAgentRunRequest
    RaptorBuildRequest:
      $ref: ./agent/raptor.yaml#/schemas/RaptorBuildRequest
    RaptorSourceChunk:
      $ref: ./agent/raptor.yaml#/schemas/RaptorSourceChunk
    RaptorBuildOptions:
      $ref: ./agent/raptor.yaml#/schemas/RaptorBuildOptions
    RaptorBuildResponse:
      $ref: ./agent/raptor.yaml#/schemas/RaptorBuildResponse
    RaptorNode:
      $ref: ./agent/raptor.yaml#/schemas/RaptorNode
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
    PetProfile:
      $ref: ./agent/pets.yaml#/schemas/PetProfile
    PixelPetSprite:
      $ref: ./agent/pets.yaml#/schemas/PixelPetSprite
    GeneratedPixelPet:
      $ref: ./agent/pets.yaml#/schemas/GeneratedPixelPet
    GeneratePixelPetRequest:
      $ref: ./agent/pets.yaml#/schemas/GeneratePixelPetRequest
    GeneratePixelPetResponse:
      $ref: ./agent/pets.yaml#/schemas/GeneratePixelPetResponse
    PetPreferences:
      $ref: ./agent/pets.yaml#/schemas/PetPreferences
    Provider:
      $ref: ./agent/execution-policy.yaml#/schemas/Provider
    ReasoningEffort:
      $ref: ./agent/execution-policy.yaml#/schemas/ReasoningEffort
    GeneratePetRequest:
      $ref: ./agent/pets.yaml#/schemas/GeneratePetRequest
    GeneratePetResponse:
      $ref: ./agent/pets.yaml#/schemas/GeneratePetResponse
