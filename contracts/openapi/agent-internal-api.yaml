openapi: 3.1.0
info:
  title: Freelance Ops Agent Internal API
  version: 0.1.0
  description: Spring Boot가 FastAPI/LangGraph run을 제어하는 내부 전용 계약
servers:
  - url: http://agent:8000
    description: Docker internal network
tags:
  - name: Health
  - name: AgentRuns
paths:
  /health:
    get:
      tags: [Health]
      operationId: getAgentHealth
      responses:
        "200":
          description: Agent service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/v1/agent-runs:
    post:
      tags: [AgentRuns]
      operationId: startAgentRun
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunRequest"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}:
    get:
      tags: [AgentRuns]
      operationId: getAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current public run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/resume:
    post:
      tags: [AgentRuns]
      operationId: resumeAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeAgentRunRequest"
      responses:
        "202":
          description: Resume command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
components:
  securitySchemes:
    delegationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived audience-bound token issued by Spring Boot
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: RFC 9457 compatible problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: agent
        version:
          type: string
    TrustedRunContext:
      type: object
      additionalProperties: false
      required:
        - runId
        - threadId
        - traceId
        - workspaceId
        - projectId
        - initiatedBy
        - effectivePermissions
      properties:
        runId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        workspaceId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        initiatedBy:
          type: string
          format: uuid
        effectivePermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    RunBudget:
      type: object
      additionalProperties: false
      required:
        - maxDurationSeconds
        - maxModelCalls
        - maxToolCalls
        - maxInputTokens
        - maxOutputTokens
        - maxDepartments
        - maxHierarchyDepth
      properties:
        maxDurationSeconds:
          type: integer
          minimum: 1
          maximum: 900
        maxModelCalls:
          type: integer
          minimum: 0
          maximum: 50
        maxToolCalls:
          type: integer
          minimum: 0
          maximum: 100
        maxInputTokens:
          type: integer
          minimum: 0
        maxOutputTokens:
          type: integer
          minimum: 0
        maxDepartments:
          type: integer
          minimum: 1
          maximum: 4
        maxHierarchyDepth:
          type: integer
          minimum: 1
          maximum: 2
    ModelSelection:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider:
          type: string
          enum: [OPENAI, GEMINI]
        model:
          type: string
          minLength: 1
          maxLength: 100
        reasoningEffort:
          type: string
          enum: [NONE, LOW, MEDIUM, HIGH]
          default: LOW
    AgentRunRequest:
      type: object
      additionalProperties: false
      required: [context, budget, modelSelection, requestTier, input]
      properties:
        context:
          $ref: "#/components/schemas/TrustedRunContext"
        budget:
          $ref: "#/components/schemas/RunBudget"
        modelSelection:
          $ref: "#/components/schemas/ModelSelection"
        requestTier:
          type: string
          enum: [DIRECT_TOOL, SINGLE_AGENT, DEPARTMENT, MULTI_DEPARTMENT]
        input:
          type: object
          additionalProperties: false
          required: [requirementText]
          properties:
            requirementText:
              type: string
              minLength: 1
              maxLength: 50000
            locale:
              type: string
              default: ko-KR
            jurisdictionCode:
              type: string
              minLength: 2
              maxLength: 32
    AgentRunAccepted:
      type: object
      additionalProperties: false
      required: [runId, status, acceptedAt]
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          const: QUEUED
        acceptedAt:
          type: string
          format: date-time
    AgentRunStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - WAITING_FOR_USER
        - COMPLETED
        - FAILED
        - CANCELLED
    DepartmentName:
      type: string
      enum: [REQUIREMENTS, RESEARCH, DEAL_DESIGN, VERIFICATION]
    DepartmentResult:
      type: object
      additionalProperties: false
      required: [department, status, summary, evidenceIds, assumptionIds]
      properties:
        department:
          $ref: "#/components/schemas/DepartmentName"
        status:
          type: string
          enum: [COMPLETED, PARTIAL, FAILED, SKIPPED]
        summary:
          type: string
          maxLength: 10000
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
        assumptionIds:
          type: array
          items:
            type: string
            format: uuid
        errorCode:
          type: string
          maxLength: 100
    AgentRunResult:
      type: object
      additionalProperties: false
      required: [projectSummary, openQuestions, departmentResults]
      properties:
        projectSummary:
          type: string
          maxLength: 10000
        openQuestions:
          type: array
          items:
            type: string
            maxLength: 1000
        departmentResults:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/DepartmentResult"
    AgentRunView:
      type: object
      additionalProperties: false
      required: [runId, status, updatedAt]
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        activeDepartment:
          $ref: "#/components/schemas/DepartmentName"
        interruption:
          $ref: "#/components/schemas/AgentInterruption"
        result:
          $ref: "#/components/schemas/AgentRunResult"
        updatedAt:
          type: string
          format: date-time
    AgentInterruption:
      type: object
      additionalProperties: false
      required: [interruptionId, kind, questions]
      properties:
        interruptionId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CLARIFICATION, RISK_DECISION, QUOTE_APPROVAL]
        questions:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 1000
    ResumeAgentRunRequest:
      type: object
      additionalProperties: false
      required: [interruptionId, idempotencyKey, answers]
      properties:
        interruptionId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
        answers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [questionIndex, answer]
            properties:
              questionIndex:
                type: integer
                minimum: 0
              answer:
                type: string
                minLength: 1
                maxLength: 5000
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string

