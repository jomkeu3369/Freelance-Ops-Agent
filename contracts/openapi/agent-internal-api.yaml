openapi: 3.1.0
info:
  title: Freelance Ops Agent Internal API
  version: 0.7.0
  description: Spring Boot가 FastAPI/LangGraph run을 제어하는 내부 전용 계약
servers:
  - url: http://agent:8000
    description: Docker internal network
tags:
  - name: Health
  - name: AgentRuns
  - name: AgentTaskCommands
  - name: QuotationAssumptions
  - name: Raptor
  - name: AIPlatform
paths:
  /internal/v1/attachments/extract:
    post:
      tags: [Attachments]
      operationId: extractChatAttachment
      security:
        - delegationToken: []
      description: Authenticated local extraction only. At most 2 MiB source bytes, 15 seconds, two readers. OCR is bounded and PARTIAL; no external model call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [context, file]
              properties:
                context:
                  $ref: '#/components/schemas/TrustedRunContext'
                file:
                  type: object
                  additionalProperties: false
                  required: [name, mediaType, base64]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 180}
                    mediaType: {type: string, maxLength: 100}
                    base64: {type: string, minLength: 1, maxLength: 2796204}
                    encoding: {type: string, maxLength: 10, default: auto}
                    delimiter: {type: string, maxLength: 4, default: auto}
      responses:
        '200':
          description: Bounded text with explicit extraction coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentText'
        '400': {description: Invalid context or file request}
        '401': {description: Delegation token required}
        '403': {description: Delegation or project scope mismatch}
        '413': {description: Input or output limits exceeded}
        '422': {description: 'Invalid file, extraction failure, timeout or parser resource limit'}
        '429': {description: Reader busy}
  /internal/v1/pets/generate:
    post:
      tags:
      - Pets
      operationId: generatePetProfile
      security:
      - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePetRequest'
      responses:
        "409":
          description: Standalone operation has no approved monetary reservation protocol and is disabled before provider I/O.
        '200':
          description: Reviewable profile, not persisted; max 1 call / 1000 output tokens
            / 30 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratePetResponse'
        '403':
          description: Delegation scope mismatch
        '502':
          description: Generation failed; no fallback
        '503':
          description: Gateway unavailable
  /health:
    get:
      tags: [Health]
      operationId: getAgentHealth
      responses:
        "200":
          description: Agent process is alive; dependency readiness is checked separately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/readiness:
    get:
      tags: [Health]
      operationId: getAgentReadiness
      responses:
        "200":
          description: Runtime startup completed and the configured database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Runtime is starting, stopping, or its required database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/v1/agent-runs:
    post:
      tags: [AgentRuns]
      operationId: startAgentRun
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunRequest"
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}:
    get:
      tags: [AgentRuns]
      operationId: getAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current public run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/resume:
    post:
      tags: [AgentRuns]
      operationId: resumeAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeAgentRunRequest"
      responses:
        "202":
          description: Resume command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunAccepted"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/events:
    get:
      tags: [AgentRuns]
      operationId: streamAgentRunEvents
      description: Streams ordered run events as server-sent events and supports reconnect cursors.
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Ordered Agent run event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/route-observations:
    get:
      tags: [AgentRuns]
      operationId: getRouteObservations
      description: Returns a finite, cursor-based snapshot of persisted route.selected events.
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: After-Event-ID
          in: header
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: At most 100 route observations after the supplied cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteObservationBatch"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/cancel:
    post:
      tags: [AgentRuns]
      operationId: cancelAgentRun
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Cancelled run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunView"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/agent-runs/{runId}/task-commands:
    post:
      tags: [AgentTaskCommands]
      operationId: acceptAgentTaskCommand
      description: Accepts one durable, revision-fenced Task control command.
      security:
        - delegationToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTaskCommand"
      responses:
        "202":
          description: Task command was durably accepted or replayed idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTaskCommandAcceptance"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/quotation-assumptions/suggest:
    post:
      tags: [QuotationAssumptions]
      operationId: suggestQuotationAssumption
      description: Suggests one reviewable assumption without changing quotation quantities or prices.
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssumptionSuggestionRequest"
      responses:
        "409":
          description: Standalone operation has no approved monetary reservation protocol and is disabled before provider I/O.
        "200":
          description: Reviewable assumption suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssumptionSuggestionResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/raptor/build:
    post:
      tags: [Raptor]
      operationId: buildRaptorIndex
      description: Builds storage-neutral RAPTOR nodes; Spring owns persistence and publication.
      security:
        - delegationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaptorBuildRequest"
      responses:
        "409":
          description: Standalone operation has no approved monetary reservation protocol and is disabled before provider I/O.
        "200":
          description: RAPTOR nodes ready for Spring persistence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaptorBuildResponse"
        "400":
          $ref: "#/components/responses/ProblemResponse"
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "502":
          $ref: "#/components/responses/ProblemResponse"
        "504":
          $ref: "#/components/responses/ProblemResponse"
  /internal/v1/platform/metrics:
    get:
      tags: [AIPlatform]
      operationId: getAiGatewayMetrics
      description: Returns prompt-free AI Gateway metrics for an internal Prometheus scraper.
      security:
        - metricsToken: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
components:
  securitySchemes:
    delegationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    metricsToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Short-lived audience-bound token issued by Spring Boot
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ProblemResponse:
      description: RFC 9457 compatible problem response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: UP
        service:
          type: string
          const: agent
        version:
          type: string
    TrustedRunContext:
      type: object
      additionalProperties: false
      required:
        - runId
        - threadId
        - traceId
        - workspaceId
        - projectId
        - initiatedBy
        - effectivePermissions
      properties:
        runId:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        workspaceId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        initiatedBy:
          type: string
          format: uuid
        effectivePermissions:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    RunBudget:
      type: object
      additionalProperties: false
      required:
        - maxDurationSeconds
        - maxModelCalls
        - maxToolCalls
        - maxInputTokens
        - maxOutputTokens
        - maxDepartments
        - maxHierarchyDepth
        - maxSearchCredits
        - maxRetries
        - maxHandoffs
      properties:
        maxDurationSeconds:
          type: integer
          minimum: 1
          maximum: 900
        maxModelCalls:
          type: integer
          minimum: 0
          maximum: 50
        maxToolCalls:
          type: integer
          minimum: 0
          maximum: 100
        maxInputTokens:
          type: integer
          minimum: 0
        maxOutputTokens:
          type: integer
          minimum: 0
        maxDepartments:
          type: integer
          minimum: 1
          maximum: 4
        maxHierarchyDepth:
          type: integer
          minimum: 1
          maximum: 2
        maxSearchCredits:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
        maxRetries:
          type: integer
          minimum: 0
          maximum: 5
          default: 1
        maxHandoffs:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
    ModelSelection:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        credentialId:
          type: [string, "null"]
          format: uuid
          description: Personal connection identifier; absent means platform credentials. Never an API key.
        provider:
          type: string
          enum: [OPENAI]
          description: New executions support OpenAI only; Gemini may remain in historical response records.
        model:
          type: string
          minLength: 1
          maxLength: 100
        reasoningEffort:
          type: string
          enum: [NONE, LOW, MEDIUM, HIGH]
          default: LOW
    AssumptionSuggestionRequest:
      type: object
      additionalProperties: false
      required:
        - context
        - modelSelection
        - projectRequirement
        - itemTitle
        - quantity
        - unit
      properties:
        context:
          $ref: "#/components/schemas/TrustedRunContext"
        modelSelection:
          $ref: "#/components/schemas/ModelSelection"
        projectRequirement:
          type: string
          minLength: 1
          maxLength: 50000
        itemTitle:
          type: string
          minLength: 1
          maxLength: 200
        itemDescription:
          type: string
          maxLength: 5000
          default: ""
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          minLength: 1
          maxLength: 20
        currentAssumption:
          type: string
          maxLength: 3000
          default: ""
    AssumptionSuggestionResponse:
      type: object
      additionalProperties: false
      required: [runId, content, provider, model, usage]
      properties:
        runId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 3000
        provider:
          type: string
          enum: [OPENAI, GEMINI]
        model:
          type: string
          minLength: 1
          maxLength: 100
        usage:
          $ref: "#/components/schemas/AssumptionSuggestionUsage"
    AssumptionSuggestionUsage:
      type: object
      additionalProperties: false
      required: [modelCalls, inputTokens, outputTokens, retryCount, durationMs]
      properties:
        modelCalls: {type: integer, minimum: 0}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
        retryCount: {type: integer, minimum: 0}
        durationMs: {type: integer, minimum: 0}
    PlatformBudget:
      type: object
      additionalProperties: false
      required: [reservationId, maxCostUsd, tariffVersion, validUntil]
      properties:
        reservationId:
          type: string
          format: uuid
          description: Must equal context.runId; bound to the immutable backend monetary reservation.
        maxCostUsd:
          type: [number, string]
          exclusiveMinimum: 0
          maximum: 100
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Positive finite decimal USD cap, independent of refundable user credits.
        tariffVersion:
          type: string
          minLength: 1
          maxLength: 100
        validUntil:
          type: string
          format: date-time
          description: Timezone-aware expiry at the next Seoul midnight; checked before every paid attempt and resume.
    ByokBudget:
      type: object
      additionalProperties: false
      description: >-
        Immutable backend-issued personal-key execution scope. Scope data alone never authorizes provider I/O.
        Every attempt requires atomic durable backend admission using the existing run-bound delegation token.
        The initial wall-clock deadline and conservative call/token reservations are never renewed or refunded.
      required: [scopeId, runId, workspaceId, projectId, initiatedBy, credentialId, provider, model,
                 reasoningEffort, fundingSource, serviceTier, validUntil, maxModelCalls, maxInputTokens,
                 maxOutputTokens, budget]
      properties:
        scopeId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        initiatedBy: {type: string, format: uuid}
        credentialId: {type: string, format: uuid}
        provider: {type: string, enum: [OPENAI]}
        model: {type: string, minLength: 1, maxLength: 100}
        reasoningEffort: {type: string, enum: [NONE, LOW, MEDIUM, HIGH]}
        fundingSource: {type: string, const: BYOK}
        serviceTier: {type: string, const: default}
        costNoticeVersion:
          type: [string, "null"]
          enum: [byok-standard-150k-48k-2026-10-05-v1, null]
          default: null
          description: >-
            Immutable backend notice binding. New scopes carry the supported marker after server-side
            admission checks. Absent/null only represents an already-admitted legacy scope and never
            grants a new scope, larger limits, a renewed deadline or authority to call a provider.
            Every attempt still requires the backend's durable scope authorization.
        validUntil:
          type: string
          format: date-time
          description: Initial admission plus maxDurationSeconds; timezone required, pause and resume do not extend it.
        maxModelCalls: {type: integer, minimum: 1, maximum: 50}
        maxInputTokens: {type: integer, minimum: 1}
        maxOutputTokens: {type: integer, minimum: 1}
        budget:
          $ref: "#/components/schemas/RunBudget"
    AgentRunRequest:
      type: object
      additionalProperties: false
      required: [context, budget, modelSelection, safetyContext, input]
      description: >-
        Live executions require exactly one trusted funding scope: platformBudget for ambient platform
        generation, or byokBudget for the exact selected personal credential. All context/selection/budget
        fields must match the backend scope. Legacy persisted records cannot gain a scope on resume.
        BYOK uses local routing and keyword-only retrieval; paid extras and Gemini remain unsupported.
      oneOf:
        - required: [platformBudget]
          properties:
            platformBudget: {$ref: "#/components/schemas/PlatformBudget"}
            byokBudget: {type: 'null'}
        - required: [byokBudget]
          properties:
            byokBudget: {$ref: "#/components/schemas/ByokBudget"}
            platformBudget: {type: 'null'}
      properties:
        platformBudget:
          oneOf:
            - $ref: "#/components/schemas/PlatformBudget"
            - type: 'null'
        byokBudget:
          oneOf:
            - $ref: "#/components/schemas/ByokBudget"
            - type: 'null'
        context:
          $ref: "#/components/schemas/TrustedRunContext"
        budget:
          $ref: "#/components/schemas/RunBudget"
        modelSelection:
          $ref: "#/components/schemas/ModelSelection"
        safetyContext:
          $ref: "#/components/schemas/SafetyContext"
        clarificationHistory:
          type: array
          maxItems: 30
          default: []
          items:
            $ref: "#/components/schemas/ClarificationAnswer"
        input:
          type: object
          additionalProperties: false
          required: [requirementText]
          properties:
            skillSelection:
              oneOf:
                - $ref: '#/components/schemas/SkillSelection'
                - type: 'null'
            attachments:
              type: array
              maxItems: 6
              default: []
              description: Untrusted reference data only, at most 40000 aggregate text characters and 8 MiB source bytes.
              items:
                $ref: '#/components/schemas/AttachmentText'
            petProfiles:
              type: array
              maxItems: 3
              items:
                $ref: '#/components/schemas/PetProfile'
            requirementText:
              type: string
              minLength: 1
              maxLength: 50000
            locale:
              type: string
              default: ko-KR
            jurisdictionCode:
              type: string
              minLength: 2
              maxLength: 32
            directToolOperation:
              type: string
              enum: [GET_PROJECT_CONTEXT]
            workflowMode:
              type: string
              enum: [PROJECT_ANALYSIS, AD_HOC]
              default: PROJECT_ANALYSIS
              description: Full project analysis is the default; AD_HOC is used for ordinary project chat and selected skill tasks without mandatory quotation analysis.
    ClarificationAnswer:
      type: object
      additionalProperties: false
      required: [question, answer]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 5000
        answer:
          type: string
          minLength: 1
          maxLength: 5000
    SafetyContext:
      type: object
      additionalProperties: false
      properties:
        externalSideEffect:
          type: boolean
          default: false
        sensitiveData:
          type: boolean
          default: false
        financialAuthorityRequired:
          type: boolean
          default: false
        legalAuthorityRequired:
          type: boolean
          default: false
        irreversibleAction:
          type: boolean
          default: false
        approvalRequired:
          type: boolean
          default: false
        authorityVerified:
          type: boolean
          default: false
    AgentRunAccepted:
      type: object
      additionalProperties: false
      required: [runId, status, acceptedAt]
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          const: QUEUED
        acceptedAt:
          type: string
          format: date-time
    AgentTaskCommand:
      type: object
      additionalProperties: false
      required: [commandId, taskId, runId, workspaceId, expectedRevision, type, status, idempotencyKey, requestedBy, requestedAt, payload, authorizationRevision, budgetRevision, schemaVersion]
      properties:
        commandId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        runId: {type: string, format: uuid}
        workspaceId: {type: string, format: uuid}
        attemptId:
          type: [string, "null"]
          format: uuid
        expectedRevision: {type: integer, minimum: 1}
        type:
          type: string
          enum: [PAUSE, RESUME, SOFT_UPDATE, HARD_REDIRECT, CANCEL]
        status:
          type: string
          enum: [PENDING, PROCESSING, APPLIED, REJECTED, SUPERSEDED]
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
        requestedBy: {type: string, format: uuid}
        requestedAt: {type: string, format: date-time}
        payload:
          type: object
          maxProperties: 50
          additionalProperties: true
        authorizationRevision: {type: integer, minimum: 1}
        budgetRevision: {type: integer, minimum: 1}
        schemaVersion:
          type: string
          const: async-task-contract-v1
    AgentTaskCommandAcceptance:
      type: object
      additionalProperties: false
      required: [commandId, taskId, taskRevision, status, targetRevision]
      properties:
        commandId: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        taskRevision: {type: integer, minimum: 1}
        status:
          type: string
          enum: [PENDING, PROCESSING, APPLIED, REJECTED, SUPERSEDED]
        targetRevision: {type: integer, minimum: 1}
    AgentRunStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - WAITING_FOR_USER
        - COMPLETED
        - PARTIAL
        - FAILED
        - CANCELLED
    AgentRunEvent:
      type: object
      additionalProperties: false
      required: [eventId, runId, type, occurredAt, data]
      properties:
        eventId:
          type: integer
          minimum: 1
        runId:
          type: string
          format: uuid
        type:
          type: string
          pattern: "^[a-z]+(?:\\.[a-z]+)+$"
          maxLength: 100
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    RouteObservationBatch:
      type: object
      additionalProperties: false
      required: [runId, status, events, nextEventId, hasMore, terminal]
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        events:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentRunEvent"
        nextEventId:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        terminal:
          type: boolean
    DepartmentName:
      type: string
      enum: [REQUIREMENTS, RESEARCH, DEAL_DESIGN, VERIFICATION]
    SourceReference:
      type: object
      additionalProperties: false
      required: [title, url, provider, contentSha256, fetchedAt, authorityLevel, excerpt]
      properties:
        title:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
          maxLength: 2048
        provider:
          type: string
          maxLength: 50
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        fetchedAt:
          type: string
          format: date-time
        authorityLevel:
          type: string
          maxLength: 50
        jurisdiction:
          type: string
          maxLength: 32
        excerpt:
          type: string
          minLength: 1
          maxLength: 4000
    DepartmentResult:
      type: object
      additionalProperties: false
      required: [department, status, summary, evidenceIds, assumptionIds, sources]
      properties:
        department:
          $ref: "#/components/schemas/DepartmentName"
        status:
          type: string
          enum: [COMPLETED, PARTIAL, FAILED, SKIPPED]
        summary:
          type: string
          maxLength: 10000
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
        assumptionIds:
          type: array
          items:
            type: string
            format: uuid
        sources:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SourceReference"
        errorCode:
          type: string
          maxLength: 100
    AgentRunResult:
      type: object
      additionalProperties: false
      required: [projectSummary, openQuestions, departmentResults, quotationDraft, quotationDrafts]
      properties:
        projectSummary:
          type: string
          maxLength: 10000
        openQuestions:
          type: array
          items:
            type: string
            maxLength: 1000
        departmentResults:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/DepartmentResult"
        quotationDraft:
          oneOf:
            - $ref: "#/components/schemas/QuotationDraft"
            - type: "null"
          description: Deprecated compatibility view of the RECOMMENDED draft.
        quotationDrafts:
          type: array
          maxItems: 3
          description: AI-generated LEAN, RECOMMENDED, and EXPANDED drafts with distinct scope and effort.
          items:
            $ref: "#/components/schemas/QuotationDraft"
        referencedDocumentIds:
          type: array
          maxItems: 50
          description: Confirmed document IDs actually supplied by the runtime, never invented by the model.
          items:
            type: string
            format: uuid
    QuotationDraft:
      type: object
      additionalProperties: false
      required: [scenario, items]
      properties:
        petPerspective:
          anyOf:
            - $ref: '#/components/schemas/PetPerspective'
            - type: 'null'
        scenario:
          type: string
          enum: [LEAN, RECOMMENDED, EXPANDED]
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/QuotationDraftItem"
    PetPerspective:
      type: object
      additionalProperties: false
      required: [proposal, rationale, tradeoff]
      properties:
        proposal:
          type: string
          minLength: 1
          maxLength: 600
        rationale:
          type: string
          minLength: 1
          maxLength: 1000
        tradeoff:
          type: string
          minLength: 1
          maxLength: 600
    QuotationDraftItem:
      type: object
      additionalProperties: false
      required: [title, description, quantity, unit, rateCardHint, basis]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        quantity:
          type: number
          exclusiveMinimum: 0
        unit:
          type: string
          enum: [HOUR, DAY, FIXED]
        rateCardHint:
          type: [string, "null"]
          maxLength: 200
        basis:
          $ref: "#/components/schemas/QuotationDraftBasis"
    QuotationDraftBasis:
      type: object
      additionalProperties: false
      required: [type, content, sourceReference, sourceTitle]
      properties:
        type:
          type: string
          enum: [ASSUMPTION, EVIDENCE]
        content:
          type: string
          minLength: 1
          maxLength: 3000
        sourceReference:
          type: [string, "null"]
          maxLength: 2048
        sourceTitle:
          type: [string, "null"]
          maxLength: 300
    AgentRunView:
      type: object
      additionalProperties: false
      required: [runId, status, metadata, updatedAt]
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AgentRunStatus"
        activeDepartment:
          $ref: "#/components/schemas/DepartmentName"
        interruption:
          $ref: "#/components/schemas/AgentInterruption"
        result:
          $ref: "#/components/schemas/AgentRunResult"
        errorCode:
          type: string
          maxLength: 100
        metadata:
          $ref: "#/components/schemas/AgentRunMetadata"
        usage:
          $ref: "#/components/schemas/AgentRunUsage"
        updatedAt:
          type: string
          format: date-time
    AttachmentText:
      type: object
      additionalProperties: false
      required: [name, mediaType, size, sha256, status, text, notice, units]
      properties:
        name: {type: string, minLength: 1, maxLength: 180}
        mediaType: {type: string, maxLength: 100}
        size: {type: integer, minimum: 1, maximum: 2097152}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        status: {type: string, enum: [COMPLETE, PARTIAL, UNSUPPORTED]}
        text: {type: string, maxLength: 40000}
        notice: {type: string, maxLength: 1000}
        encoding: {type: [string, 'null']}
        delimiter: {type: [string, 'null']}
        units: {type: integer, minimum: 1, maximum: 5000}
    SkillSelection:
      type: object
      additionalProperties: false
      description: Version-pinned prompt composition only; never authorizes tools, data access or spending. IDs must belong to the pinned catalog.
      properties:
        mode: {type: string, enum: [AUTO, MANUAL], default: AUTO}
        catalogVersion: {type: string, enum: ['1.0.0'], default: '1.0.0'}
        manualIds:
          type: array
          maxItems: 3
          uniqueItems: true
          default: []
          items: {type: string}
        excludedIds:
          type: array
          maxItems: 60
          uniqueItems: true
          default: []
          items: {type: string}
    AgentRunMetadata:
      type: object
      additionalProperties: false
      required: [provider, model, promptVersion, toolSchemaVersion, traceId]
      properties:
        skillSelection:
          oneOf:
            - $ref: '#/components/schemas/SkillSelection'
            - type: 'null'
        resolvedSkillIds:
          type: array
          maxItems: 3
          default: []
          items: {type: string}
        deferredSkillIds:
          type: array
          maxItems: 60
          default: []
          items: {type: string}
        petProfiles:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/PetProfile'
        credentialId:
          type: [string, "null"]
          format: uuid
        provider:
          type: string
          enum: [OPENAI, GEMINI]
        model:
          type: string
          minLength: 1
          maxLength: 100
        promptVersion:
          type: string
          minLength: 1
          maxLength: 100
        toolSchemaVersion:
          type: string
          minLength: 1
          maxLength: 100
        traceId:
          type: string
          minLength: 1
          maxLength: 128
    ProviderCallUsage:
      type: object
      additionalProperties: false
      required: [callId, fundingSource, provider, model, operation, inputTokens, outputTokens, cachedReadTokens, cacheWriteTokens, costUsd, reservedCostUsd, usageKnown]
      properties:
        callId: {type: string, format: uuid}
        fundingSource: {type: string, enum: [PLATFORM, BYOK]}
        provider: {type: string, enum: [OPENAI, GEMINI]}
        model: {type: string, minLength: 1, maxLength: 100}
        operation: {type: string, minLength: 1, maxLength: 100}
        inputTokens:
          type: integer
          minimum: 0
          description: Total prompt tokens inclusive of cached reads and cache writes; conservative bound when usageKnown is false.
        outputTokens: {type: integer, minimum: 0}
        cachedReadTokens: {type: integer, minimum: 0}
        cacheWriteTokens: {type: integer, minimum: 0}
        costUsd:
          type: [number, string]
          minimum: 0
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Platform exposure at the pinned tariff; BYOK contributes zero.
        reservedCostUsd:
          type: [number, string]
          minimum: 0
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
        usageKnown:
          type: boolean
          description: False for absent/malformed usage, lost responses, uncertain failures, or bound drift. Never interpreted as zero usage.
    AgentRunUsage:
      type: object
      additionalProperties: false
      required:
        - requestTier
        - modelCalls
        - toolCalls
        - inputTokens
        - outputTokens
        - cachedTokens
        - searchCredits
        - crawledPages
        - retryCount
        - durationMs
        - providerCalls
        - platformCostUsd
      properties:
        providerCalls:
          type: array
          default: []
          description: One record per actual provider attempt, including routing, explicit retries, failures and unknown outcomes.
          items:
            $ref: "#/components/schemas/ProviderCallUsage"
        platformCostUsd:
          type: [number, string]
          minimum: 0
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
          description: Conservative platform-funded exposure; unknown attempts keep their bound and BYOK contributes zero.
        platformReservationId:
          type: [string, "null"]
          format: uuid
        byokScopeId:
          type: [string, "null"]
          format: uuid
          description: Durable BYOK attempt identity for idempotent usage merge; never a platform reservation.
        tariffVersion:
          type: [string, "null"]
        executionClosed:
          type: boolean
          default: false
          description: Worker has closed its monetary scope; only terminal runs with this evidence can release unused exposure.
        unpricedExposure:
          type: boolean
          default: false
          description: Unexpected model, tier or usage drift requires retaining the full run cap even after worker closure.
        requestTier:
          type: string
          enum: [DIRECT_TOOL, SINGLE_AGENT, DEPARTMENT, MULTI_DEPARTMENT, HUMAN_REQUIRED]
        modelCalls: {type: integer, minimum: 0}
        toolCalls: {type: integer, minimum: 0}
        inputTokens: {type: integer, minimum: 0}
        outputTokens: {type: integer, minimum: 0}
        cachedTokens: {type: integer, minimum: 0}
        searchCredits: {type: integer, minimum: 0}
        crawledPages: {type: integer, minimum: 0}
        retryCount: {type: integer, minimum: 0}
        durationMs: {type: integer, minimum: 0}
    AgentInterruption:
      type: object
      additionalProperties: false
      required: [interruptionId, kind, questions]
      properties:
        interruptionId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [CLARIFICATION, RISK_DECISION, QUOTE_APPROVAL]
        questions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 1000
    ResumeAgentRunRequest:
      type: object
      additionalProperties: false
      required: [interruptionId, idempotencyKey, answers]
      properties:
        interruptionId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 128
        answers:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [questionIndex, answer]
            properties:
              questionIndex:
                type: integer
                minimum: 0
              answer:
                type: string
                minLength: 1
                maxLength: 5000
    RaptorBuildRequest:
      type: object
      additionalProperties: false
      required: [context, provider, embeddingModel, summaryModel, chunks]
      properties:
        context:
          type: object
          additionalProperties: false
          required: [runId, workspaceId, projectId, snapshotId]
          properties:
            runId: {type: string, format: uuid}
            workspaceId: {type: string, format: uuid}
            projectId: {type: string, format: uuid}
            snapshotId: {type: string, format: uuid}
        provider:
          type: string
          enum: [OPENAI]
        embeddingModel:
          type: string
          minLength: 1
          maxLength: 100
        summaryModel:
          type: string
          minLength: 1
          maxLength: 100
        chunks:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/RaptorSourceChunk"
        options:
          $ref: "#/components/schemas/RaptorBuildOptions"
    RaptorSourceChunk:
      type: object
      additionalProperties: false
      required: [chunkId, documentId, text]
      properties:
        chunkId: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        text:
          type: string
          minLength: 1
          maxLength: 20000
        metadata:
          type: object
          additionalProperties:
            type: string
    RaptorBuildOptions:
      type: object
      additionalProperties: false
      properties:
        targetClusterSize: {type: integer, minimum: 2, maximum: 50, default: 4}
        maxSummaryLevels: {type: integer, minimum: 1, maximum: 8, default: 4}
        kmeansIterations: {type: integer, minimum: 1, maximum: 100, default: 20}
    RaptorBuildResponse:
      type: object
      additionalProperties: false
      required: [workspaceId, snapshotId, embeddingModel, summaryModel, nodes, rootIds]
      properties:
        workspaceId: {type: string, format: uuid}
        snapshotId: {type: string, format: uuid}
        embeddingModel: {type: string}
        summaryModel: {type: string}
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/RaptorNode"
        rootIds:
          type: array
          items: {type: string, format: uuid}
    RaptorNode:
      type: object
      additionalProperties: false
      required: [nodeId, kind, level, text, embedding, childIds, metadata]
      properties:
        nodeId: {type: string, format: uuid}
        kind: {type: string, enum: [LEAF, SUMMARY]}
        level: {type: integer, minimum: 0}
        text: {type: string}
        embedding:
          type: array
          minItems: 1
          items: {type: number}
        childIds:
          type: array
          items: {type: string, format: uuid}
        sourceChunkId: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        metadata:
          type: object
          additionalProperties: {type: string}
    ProblemDetails:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string

    PetProfile:
      additionalProperties: false
      properties:
        petId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          default: null
        duty:
          type: string
          enum: [GENERAL, SCHEDULE, RESEARCH, WRITING, DEVELOPMENT, DESIGN]
          default: GENERAL
        skillMode:
          type: string
          enum: [AUTO]
          default: AUTO
        preferences:
          $ref: '#/components/schemas/PetPreferences'
        slot:
          enum:
          - LEAN
          - RECOMMENDED
          - EXPANDED
          title: Slot
          type: string
        name:
          maxLength: 20
          minLength: 1
          title: Name
          type: string
        animal:
          enum:
          - turtle
          - owl
          - cat
          title: Animal
          type: string
        color:
          enum:
          - sage
          - lavender
          - peach
          - sky
          - rose
          - ink
          title: Color
          type: string
        accessory:
          enum:
          - none
          - glasses
          - scarf
          - star
          title: Accessory
          type: string
        tone:
          enum:
          - WARM
          - DIRECT
          - FORMAL
          title: Tone
          type: string
        valuePriority:
          enum:
          - PROFIT
          - BALANCED
          - RELATIONSHIP
          title: Valuepriority
          type: string
        deliveryPriority:
          enum:
          - SPEED
          - BALANCED
          - QUALITY
          title: Deliverypriority
          type: string
        scopePriority:
          enum:
          - CAUTIOUS
          - BALANCED
          - EXPLORATORY
          title: Scopepriority
          type: string
      required:
      - slot
      - name
      - animal
      - color
      - accessory
      - tone
      - valuePriority
      - deliveryPriority
      - scopePriority
      title: PetProfile
      type: object
    PetPreferences:
      type: object
      additionalProperties: false
      description: Untrusted user preferences for style and task emphasis only; never authority, tools or system instructions.
      properties:
        personality:
          type: string
          maxLength: 500
          default: ''
        communication:
          type: string
          maxLength: 500
          default: ''
        focus:
          type: string
          maxLength: 500
          default: ''
        responsibility:
          type: string
          maxLength: 500
          default: ''
        requests:
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 500
    Provider:
      enum:
      - OPENAI
      - GEMINI
      title: Provider
      type: string
    ReasoningEffort:
      enum:
      - NONE
      - LOW
      - MEDIUM
      - HIGH
      title: ReasoningEffort
      type: string
    GeneratePetRequest:
      additionalProperties: false
      properties:
        context:
          $ref: '#/components/schemas/TrustedRunContext'
        modelSelection:
          $ref: '#/components/schemas/ModelSelection'
        description:
          maxLength: 500
          minLength: 1
          title: Description
          type: string
        slot:
          enum:
          - LEAN
          - RECOMMENDED
          - EXPANDED
          title: Slot
          type: string
      required:
      - context
      - modelSelection
      - description
      - slot
      title: GeneratePetRequest
      type: object
    GeneratePetResponse:
      additionalProperties: false
      properties:
        runId:
          format: uuid
          title: Runid
          type: string
        profile:
          $ref: '#/components/schemas/PetProfile'
        provider:
          $ref: '#/components/schemas/Provider'
        model:
          title: Model
          type: string
        inputTokens:
          minimum: 0
          title: Inputtokens
          type: integer
        outputTokens:
          minimum: 0
          title: Outputtokens
          type: integer
      required:
      - runId
      - profile
      - provider
      - model
      - inputTokens
      - outputTokens
      title: GeneratePetResponse
      type: object
