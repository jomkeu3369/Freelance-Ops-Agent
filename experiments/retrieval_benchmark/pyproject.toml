[project]
name = "retrieval-benchmark"
version = "0.1.0"
description = "Retrieval and answerability benchmarks"
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "openai>=2.26,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1,<2"
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
