[project]
name = "retrieval-benchmark"
version = "0.1.0"
description = "검색 품질과 근거 기반 답변 가능성 평가"
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "openai>=2.26,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
local-models = [
    "datasets>=4.0,<5",
    "torch>=2.6,<3",
    "transformers>=5,<6"
]
pdf = ["pypdf>=6.16.1,<7"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
