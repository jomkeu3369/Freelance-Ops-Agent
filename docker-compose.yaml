version: '3.8'

services:
  app:
    image: ${DOCKER_USERNAME}/freelance-ops-agent:latest
    container_name: agent-${COLOR}
    ports:
      - "${APP_PORT}:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/agent_db
      - FAISS_INDEX_PATH=/data/faiss_index
    volumes:
      - app_logs:/src/src/logs
      - faiss_data:/data/faiss_index
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - agent-network

  mongodb:
    image: mongo:latest
    container_name: agent-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=agent_db
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  mongo_data:
  app_logs:
  faiss_data: