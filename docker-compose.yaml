name: freelance-ops-v2

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      AGENT_BACKEND_INTERNAL_URL: http://backend:8080
      AGENT_DATABASE_URL: postgresql://agent_user:${AGENT_DB_PASSWORD:-local_agent_password}@postgres:5432/freelance_ops
      AGENT_RUN_STORE_BACKEND: postgres
      AGENT_CHECKPOINT_BACKEND: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_ROUTE_EVALUATOR_MODEL: ${AGENT_ROUTE_EVALUATOR_MODEL:-gpt-5.6-luna}
      AGENT_ROUTE_EVALUATOR_REASONING_EFFORT: ${AGENT_ROUTE_EVALUATOR_REASONING_EFFORT:-low}
      AGENT_ROUTE_EVALUATOR_SYSTEM_PROMPT: ${AGENT_ROUTE_EVALUATOR_SYSTEM_PROMPT:-}
      AGENT_ROUTE_EVALUATOR_PROMPT_VERSION: ${AGENT_ROUTE_EVALUATOR_PROMPT_VERSION:-}
      AGENT_ROUTE_EVALUATOR_PROMPT_SHA256: ${AGENT_ROUTE_EVALUATOR_PROMPT_SHA256:-}
      AGENT_DELEGATION_TOKEN_ISSUER: ${AGENT_DELEGATION_TOKEN_ISSUER:-freelance-ops-backend}
      AGENT_DELEGATION_TOKEN_AUDIENCE: ${AGENT_DELEGATION_TOKEN_AUDIENCE:-freelance-ops-agent}
      AGENT_DELEGATION_TOKEN_PUBLIC_KEY: ${AGENT_DELEGATION_TOKEN_PUBLIC_KEY:-}
      AGENT_DELEGATION_TOKEN_ALGORITHMS: ${AGENT_DELEGATION_TOKEN_ALGORITHMS:-RS256}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-dev
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      DB_URL: jdbc:postgresql://postgres:5432/freelance_ops
      DB_USERNAME: app_user
      DB_PASSWORD: ${APP_DB_PASSWORD:-local_app_password}
      AGENT_BASE_URL: http://agent:8000
      AGENT_DELEGATION_TOKEN_ISSUER: ${AGENT_DELEGATION_TOKEN_ISSUER:-freelance-ops-backend}
      AGENT_DELEGATION_TOKEN_AUDIENCE: ${AGENT_DELEGATION_TOKEN_AUDIENCE:-freelance-ops-agent}
      AGENT_DELEGATION_TOKEN_PUBLIC_KEY: ${AGENT_DELEGATION_TOKEN_PUBLIC_KEY:-}
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - internal

networks:
  internal:
    external: true
    name: freelance-ops-v2-internal
