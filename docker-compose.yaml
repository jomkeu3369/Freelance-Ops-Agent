name: freelance-ops-v2

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      AGENT_BACKEND_INTERNAL_URL: http://backend:8080
      AGENT_DATABASE_URL: postgresql://agent_user:${AGENT_DB_PASSWORD:-local_agent_password}@postgres:5432/freelance_ops
      AGENT_RUN_STORE_BACKEND: postgres
      AGENT_CHECKPOINT_BACKEND: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_TRACING_V2: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-freelance-ops-agent}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_HIDE_INPUTS: "true"
      LANGSMITH_HIDE_OUTPUTS: "true"
      AGENT_WEB_RESEARCH_ENABLED: ${AGENT_WEB_RESEARCH_ENABLED:-false}
      AGENT_WEB_RESEARCH_ALLOWED_DOMAINS: ${AGENT_WEB_RESEARCH_ALLOWED_DOMAINS:-}
      AGENT_WEB_RESEARCH_MAX_RESULTS: ${AGENT_WEB_RESEARCH_MAX_RESULTS:-5}
      AGENT_WEB_RESEARCH_MAX_FETCHES: ${AGENT_WEB_RESEARCH_MAX_FETCHES:-3}
      AGENT_WEB_RESEARCH_TIMEOUT_SECONDS: ${AGENT_WEB_RESEARCH_TIMEOUT_SECONDS:-30}
      AGENT_GATEWAY_MAX_CONCURRENCY: ${AGENT_GATEWAY_MAX_CONCURRENCY:-2}
      AGENT_GATEWAY_ACQUIRE_TIMEOUT_SECONDS: ${AGENT_GATEWAY_ACQUIRE_TIMEOUT_SECONDS:-2}
      AGENT_GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${AGENT_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-3}
      AGENT_GATEWAY_CIRCUIT_RECOVERY_SECONDS: ${AGENT_GATEWAY_CIRCUIT_RECOVERY_SECONDS:-30}
      AGENT_GATEWAY_ALLOWED_MODELS: ${AGENT_GATEWAY_ALLOWED_MODELS:-}
      AGENT_GATEWAY_METRICS_ENABLED: ${AGENT_GATEWAY_METRICS_ENABLED:-false}
      AGENT_GATEWAY_METRICS_BEARER_TOKEN: ${AGENT_GATEWAY_METRICS_BEARER_TOKEN:-}
      AGENT_ROUTE_EVALUATOR_MODEL: ${AGENT_ROUTE_EVALUATOR_MODEL:-gpt-5.6-luna}
      AGENT_ROUTE_EVALUATOR_REASONING_EFFORT: ${AGENT_ROUTE_EVALUATOR_REASONING_EFFORT:-low}
      AGENT_ROUTE_EVALUATOR_SYSTEM_PROMPT: ${AGENT_ROUTE_EVALUATOR_SYSTEM_PROMPT:-}
      AGENT_ROUTE_EVALUATOR_PROMPT_VERSION: ${AGENT_ROUTE_EVALUATOR_PROMPT_VERSION:-}
      AGENT_ROUTE_EVALUATOR_PROMPT_SHA256: ${AGENT_ROUTE_EVALUATOR_PROMPT_SHA256:-}
      AGENT_DELEGATION_TOKEN_ISSUER: ${AGENT_DELEGATION_TOKEN_ISSUER:-freelance-ops-backend}
      AGENT_DELEGATION_TOKEN_AUDIENCE: ${AGENT_DELEGATION_TOKEN_AGENT_AUDIENCE:-freelance-ops-agent}
      AGENT_DELEGATION_TOKEN_PUBLIC_KEY: ${AGENT_DELEGATION_TOKEN_PUBLIC_KEY:-}
      AGENT_DELEGATION_TOKEN_KEY_ID: ${AGENT_DELEGATION_TOKEN_KEY_ID:-freelance-ops-v1}
      AGENT_DELEGATION_TOKEN_PREVIOUS_KEY_ID: ${AGENT_DELEGATION_TOKEN_PREVIOUS_KEY_ID:-}
      AGENT_DELEGATION_TOKEN_PREVIOUS_PUBLIC_KEY: ${AGENT_DELEGATION_TOKEN_PREVIOUS_PUBLIC_KEY:-}
      AGENT_DELEGATION_TOKEN_ALGORITHMS: ${AGENT_DELEGATION_TOKEN_ALGORITHMS:-RS256}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-dev
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_AUTH_PER_MINUTE: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:-20}
      APP_RATE_LIMIT_PUBLIC_PROPOSAL_PER_MINUTE: ${APP_RATE_LIMIT_PUBLIC_PROPOSAL_PER_MINUTE:-30}
      APP_RATE_LIMIT_AGENT_PER_MINUTE: ${APP_RATE_LIMIT_AGENT_PER_MINUTE:-20}
      APP_RATE_LIMIT_MAX_ENTRIES: ${APP_RATE_LIMIT_MAX_ENTRIES:-10000}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      DB_URL: jdbc:postgresql://postgres:5432/freelance_ops
      DB_USERNAME: app_user
      DB_PASSWORD: ${APP_DB_PASSWORD:-local_app_password}
      AGENT_BASE_URL: http://agent:8000
      AGENT_QUOTA_MAX_DURATION_SECONDS: ${AGENT_QUOTA_MAX_DURATION_SECONDS:-180}
      AGENT_QUOTA_MAX_MODEL_CALLS: ${AGENT_QUOTA_MAX_MODEL_CALLS:-12}
      AGENT_QUOTA_MAX_TOOL_CALLS: ${AGENT_QUOTA_MAX_TOOL_CALLS:-12}
      AGENT_QUOTA_MAX_INPUT_TOKENS: ${AGENT_QUOTA_MAX_INPUT_TOKENS:-50000}
      AGENT_QUOTA_MAX_OUTPUT_TOKENS: ${AGENT_QUOTA_MAX_OUTPUT_TOKENS:-12000}
      AGENT_QUOTA_MAX_SEARCH_CREDITS: ${AGENT_QUOTA_MAX_SEARCH_CREDITS:-2}
      AGENT_DELEGATION_TOKEN_ISSUER: ${AGENT_DELEGATION_TOKEN_ISSUER:-freelance-ops-backend}
      AGENT_DELEGATION_TOKEN_AGENT_AUDIENCE: ${AGENT_DELEGATION_TOKEN_AGENT_AUDIENCE:-freelance-ops-agent}
      AGENT_DELEGATION_TOKEN_TOOL_AUDIENCE: ${AGENT_DELEGATION_TOKEN_TOOL_AUDIENCE:-freelance-ops-spring-tools}
      AGENT_DELEGATION_TOKEN_KEY_ID: ${AGENT_DELEGATION_TOKEN_KEY_ID:-freelance-ops-v1}
      AGENT_DELEGATION_TOKEN_PREVIOUS_KEY_ID: ${AGENT_DELEGATION_TOKEN_PREVIOUS_KEY_ID:-}
      AGENT_DELEGATION_TOKEN_PREVIOUS_PUBLIC_KEY: ${AGENT_DELEGATION_TOKEN_PREVIOUS_PUBLIC_KEY:-}
      AGENT_DELEGATION_TOKEN_TTL_SECONDS: ${AGENT_DELEGATION_TOKEN_TTL_SECONDS:-60}
      AGENT_DELEGATION_TOKEN_PRIVATE_KEY: ${AGENT_DELEGATION_TOKEN_PRIVATE_KEY:-}
      AGENT_DELEGATION_TOKEN_PUBLIC_KEY: ${AGENT_DELEGATION_TOKEN_PUBLIC_KEY:-}
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - internal

networks:
  internal:
    external: true
    name: freelance-ops-v2-internal
