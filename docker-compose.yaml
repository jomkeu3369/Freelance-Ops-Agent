version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/src
      - /src/.venv 
    ports:
      - 8000:8000
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - MONGO_URL=mongodb://mongodb:27017/agent_db
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - mongodb
    deploy:
      resources:
        limits:
          memory: 300M
    
  mongodb:
    image: mongo:latest
    container_name: agent-mongodb
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=agent_db
    deploy:
      resources:
        limits:
          memory: 200M

volumes:
  mongo_data: