[project]
name = "freelance-ops-ai-platform"
version = "0.1.0"
description = "인증된 Spring 공개 API로 Agent 실행을 시작·조회·취소하는 Python 클라이언트"
readme = "README.md"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freelance_ops_ai"]
