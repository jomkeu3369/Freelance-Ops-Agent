name: freelance-ops-v2

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelance_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_postgres_password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local_app_password}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-local_agent_password}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_ops"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      AGENT_BACKEND_INTERNAL_URL: http://backend:8080
      AGENT_DATABASE_URL: postgresql://agent_user:${AGENT_DB_PASSWORD:-local_agent_password}@postgres:5432/freelance_ops
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-dev
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DB_URL: jdbc:postgresql://postgres:5432/freelance_ops
      DB_USERNAME: app_user
      DB_PASSWORD: ${APP_DB_PASSWORD:-local_app_password}
      AGENT_BASE_URL: http://agent:8000
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_v2_data:
