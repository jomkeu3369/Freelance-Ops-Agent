name: Contracts & Compose CI

on:
  workflow_call:
  pull_request:
    paths:
      - "contracts/**"
      - "infra/**"
      - ".github/actions/deploy-service/**"
      - ".github/scripts/deployment_scope.py"
      - ".github/workflows/production-auto-cd.yml"
      - "docker-compose-infra.yaml"
      - "docker-compose.yaml"
      - "docker-compose.production.yaml"
      - ".github/workflows/contracts-compose-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-compose-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenAPI contracts and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uvx --from openapi-spec-validator openapi-spec-validator contracts/openapi/agent-internal-api.yaml contracts/openapi/spring-tool-api.yaml
      - run: docker compose -f docker-compose-infra.yaml config
      - run: docker compose -f docker-compose.yaml config
      - name: 인프라 셸 스크립트 검사
        run: |
          shellcheck -x infra/postgres/init/*.sh infra/scripts/*.sh infra/scripts/lib/*.sh infra/tests/*.sh
      - name: 서비스 배포·롤백 회귀 검사
        run: sh infra/tests/test-deploy.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 외부 호출 없이 부하 시나리오 계약 검사
        run: node --experimental-vm-modules --test infra/tests/test-load.mjs
      - name: 백업 소유권과 서비스 권한 복구 검사
        run: sh infra/tests/test-backup-restore.sh
      - name: 개인 키 암호화 설정 유지 검사
        run: sh infra/tests/test-byok-key.sh
      - run: docker compose -f docker-compose.yaml -f docker-compose.production.yaml config
        env:
          APP_DOMAIN: example.com
          BACKEND_IMAGE: example/backend
          AGENT_IMAGE: example/agent
          BACKEND_IMAGE_TAG: backend-ci
          AGENT_IMAGE_TAG: agent-ci
          APP_DB_PASSWORD: ci-app-password
          AGENT_DB_PASSWORD: ci-agent-password
          APP_AUTH_JWT_SECRET: ci-only-auth-secret-with-at-least-32-bytes
          AGENT_DELEGATION_TOKEN_PRIVATE_KEY: ci-private-key-placeholder
          AGENT_DELEGATION_TOKEN_PUBLIC_KEY: ci-public-key-placeholder
          AGENT_ROUTE_EVALUATOR_SYSTEM_PROMPT: ci-private-prompt-placeholder
          AGENT_ROUTE_EVALUATOR_PROMPT_VERSION: ci-v1
          AGENT_ROUTE_EVALUATOR_PROMPT_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
