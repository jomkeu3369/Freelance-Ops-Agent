name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/fixtures/workspace-credit-contract.json"
      - ".github/workflows/frontend-ci.yml"
      - ".github/scripts/with-frontend-server.sh"
  push:
    branches:
      - "main"
    paths:
      - "frontend/**"
      - "contracts/fixtures/workspace-credit-contract.json"
      - ".github/workflows/frontend-ci.yml"
      - ".github/scripts/with-frontend-server.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ci:check

  synthetic-browser:
    name: Synthetic Chromium workspace checks
    # 같은 저장소의 PR과 수동 실행에서 합성 데이터로 검사한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 검사용 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 검사용 로컬 애플리케이션 빌드
        run: npm run build
      - name: 외부 통신을 차단한 합성 시나리오 검사
        run: |
          bash ../.github/scripts/with-frontend-server.sh outputs/ui-ux bash -e -o pipefail -c '
            node scripts/verify-search-metadata.mjs
            npx playwright test --forbid-only \
              tests/browser/search-metadata.spec.mjs \
              tests/browser/landing-header.spec.mjs \
              tests/browser/readme-screenshots.spec.mjs \
              tests/browser/composer-design.spec.mjs \
              tests/browser/settings-mutations.spec.mjs \
              tests/browser/skills-integrated.spec.mjs \
              tests/browser/custom-agent-pets.spec.mjs \
              tests/browser/pet-quotation-workflow.spec.mjs \
              tests/browser/workspace-companion.spec.mjs \
              tests/browser/chat-attachments.spec.mjs \
              tests/browser/attachment-cards.spec.mjs \
              tests/browser/admin-members.spec.mjs \
              tests/browser/admin-costs.spec.mjs \
              tests/browser/run-continuity.spec.mjs \
              tests/browser/composer-toolbar.spec.mjs \
              tests/browser/fullscreen-chat.spec.mjs \
              tests/browser/short-height-chat.spec.mjs \
              tests/browser/project-step-shell.spec.mjs \
              tests/browser/auth-error.spec.mjs \
              tests/browser/auth-session.spec.mjs \
              tests/browser/auth-cinematic.spec.mjs \
              tests/browser/byok-bounded.spec.mjs \
              tests/browser/chat-markdown.spec.mjs \
              tests/browser/chat-history.spec.mjs \
              tests/browser/project-mutations.spec.mjs \
              tests/browser/quotation-pagination.spec.mjs
          '
      - name: 합성 브라우저 검사 근거 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-reports-${{ github.sha }}
          path: |
            frontend/outputs/ui-ux/
            frontend/outputs/pet-readiness/screenshots/
          if-no-files-found: warn
          retention-days: 7

  search-preview:
    name: Preview search exclusion checks
    # 로컬 빌드만 사용하며 운영 계정과 외부 AI 호출은 필요하지 않다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL: "0"
      VERCEL_ENV: preview
      VERCEL_URL: synthetic-preview.vercel.app
      SEO_EXPECT_PREVIEW: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 미리보기 HTML·헤더·검색 제외 설정 검사
        run: |
          bash ../.github/scripts/with-frontend-server.sh outputs/search-preview bash -e -o pipefail -c '
            node scripts/verify-search-metadata.mjs | tee outputs/search-preview/results.log
          '
      - name: 미리보기 검색 검사 근거 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-preview-reports-${{ github.sha }}
          path: frontend/outputs/search-preview/
          if-no-files-found: warn
          retention-days: 7
