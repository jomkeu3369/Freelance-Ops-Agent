name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/fixtures/workspace-credit-contract.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - "work/integrate-chat-settings-project-20261010"
      - "work/attachment-history-boundaries-20261010"
      - "work/settings-session-accessibility-20261010"
      - "work/project-mutation-boundaries-20261010"
      - "codex/readme-product-screenshots-20261009"
      - "codex/workspace-pet-companion-20261009"
      - "codex/attachment-reference-ui-20261008"
      - "codex/auth-ocr-integration-20261007"
      - "codex/ocr-language-layout-coverage-20261007"
      - "codex/login-session-reliability-20261007"
      - "codex/compatible-toolchain-fixes-20261006"
      - "codex/next-security-patch-20261006"
      - "codex/chat-flow-hardening-20261006"
      - "codex/overnight-quality-integration-20261006"
      - "codex/chat-composer-settings-20261006"
      - "codex/offline-flow-regressions-20261006"
      - "codex/partial-chat-history-20261006"
      - "main"
      - "codex/cloud-feature-integration-20261005"
      - "codex/login-pet-road-20261005"
      - "codex/login-pet-motion-20261005"
      - "codex/login-footer-center-20261005"
      - "codex/byok-release-integration-20261005"
      - "codex/chat-markdown-20261005"
      - "codex/markdown-release-20261005"
    paths:
      - "frontend/**"
      - "contracts/fixtures/workspace-credit-contract.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run ci:check

  synthetic-browser:
    name: Synthetic Chromium workspace checks
    # Work-branch and same-repository PR verification. No deployment or provider calls.
    if: github.ref == 'refs/heads/work/integrate-chat-settings-project-20261010' || github.ref == 'refs/heads/work/project-mutation-boundaries-20261010' || github.ref == 'refs/heads/work/attachment-history-boundaries-20261010' || github.ref == 'refs/heads/work/settings-session-accessibility-20261010' || github.ref == 'refs/heads/codex/readme-product-screenshots-20261009' || github.ref == 'refs/heads/codex/workspace-pet-companion-20261009' || github.ref == 'refs/heads/codex/attachment-reference-ui-20261008' || github.ref == 'refs/heads/codex/auth-ocr-integration-20261007' || github.ref == 'refs/heads/codex/login-session-reliability-20261007' || github.ref == 'refs/heads/codex/ocr-language-layout-coverage-20261007' || github.ref == 'refs/heads/codex/compatible-toolchain-fixes-20261006' || github.ref == 'refs/heads/codex/next-security-patch-20261006' || github.ref == 'refs/heads/codex/chat-flow-hardening-20261006' || github.ref == 'refs/heads/codex/overnight-quality-integration-20261006' || github.ref == 'refs/heads/codex/chat-composer-settings-20261006' || github.ref == 'refs/heads/codex/offline-flow-regressions-20261006' || github.ref == 'refs/heads/codex/partial-chat-history-20261006' || github.ref == 'refs/heads/codex/cloud-feature-integration-20261005' || github.ref == 'refs/heads/codex/login-pet-road-20261005' || github.ref == 'refs/heads/codex/login-pet-motion-20261005' || github.ref == 'refs/heads/codex/login-footer-center-20261005' || github.ref == 'refs/heads/codex/byok-release-integration-20261005' || github.ref == 'refs/heads/codex/chat-markdown-20261005' || github.ref == 'refs/heads/codex/markdown-release-20261005' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build ephemeral local application
        run: npm run build
      - name: Exercise network-blocked synthetic fixtures
        run: |
          mkdir -p outputs/ui-ux
          npm run start -- --hostname 127.0.0.1 --port 3100 > outputs/ui-ux/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat outputs/ui-ux/server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat outputs/ui-ux/server.log
            exit 1
          fi
          # Every selected suite uses synthetic session/API fixtures and blocks
          # non-local requests. No backend, real accounts, or provider keys run.
          npx playwright test --forbid-only \
            tests/browser/readme-screenshots.spec.mjs \
            tests/browser/composer-design.spec.mjs \
            tests/browser/settings-mutations.spec.mjs \
            tests/browser/skills-integrated.spec.mjs \
            tests/browser/custom-agent-pets.spec.mjs \
            tests/browser/workspace-companion.spec.mjs \
            tests/browser/chat-attachments.spec.mjs \
            tests/browser/attachment-cards.spec.mjs \
            tests/browser/admin-members.spec.mjs \
            tests/browser/composer-toolbar.spec.mjs \
            tests/browser/fullscreen-chat.spec.mjs \
            tests/browser/auth-error.spec.mjs \
            tests/browser/auth-session.spec.mjs \
            tests/browser/auth-cinematic.spec.mjs \
            tests/browser/byok-bounded.spec.mjs \
            tests/browser/chat-markdown.spec.mjs \
            tests/browser/chat-history.spec.mjs \
            tests/browser/project-mutations.spec.mjs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-reports-${{ github.sha }}
          path: frontend/outputs/ui-ux/
          if-no-files-found: warn
          retention-days: 7
