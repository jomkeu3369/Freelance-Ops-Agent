name: Production Bounded Readiness Observation

on:
  push:
    branches:
      - codex/production-verify-run-20261005
    paths:
      - '.github/workflows/production-release-verify.yml'
      - 'infra/scripts/production-bounded-readiness.py'
      - 'infra/tests/test_production_bounded_readiness.py'

permissions:
  contents: read

concurrency:
  group: v2-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only production readiness preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate observation guardrails
        run: python3 -m unittest discover -s infra/tests -p test_production_bounded_readiness.py -v
      - name: Configure existing SSH identity and trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VULTR_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Observe production without application credentials
        env:
          DEPLOY_HOST: ${{ secrets.VULTR_HOST }}
          DEPLOY_USER: ${{ secrets.VULTR_USER }}
          OBSERVATION_MODE: preflight
        run: |
          test "$DEPLOY_HOST" = "158.247.196.242"
          test "$DEPLOY_USER" = "root"
          case "$OBSERVATION_MODE" in preflight|campaign) ;; *) exit 2;; esac
          set -o pipefail
          timeout --signal=TERM 300s ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "python3 - '$OBSERVATION_MODE'" \
            < infra/scripts/production-bounded-readiness.py | tee production-readiness.jsonl
      - name: Save aggregate-only observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bounded-readiness-${{ github.run_id }}
          path: production-readiness.jsonl
          if-no-files-found: ignore
          retention-days: 14
