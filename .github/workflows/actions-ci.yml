name: Actions CI

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow and automation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 배포 범위·증거 검사·셸 동작 회귀 검사
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: 배포·프런트엔드 검증 셸 검사
        run: shellcheck .github/actions/deploy-service/*.sh .github/scripts/*.sh
      - name: 고정 actionlint 배포본 설치와 워크플로 검사
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_directory="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_directory"
          archive="$tool_directory/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tool_directory"
          "$tool_directory/actionlint" -color
