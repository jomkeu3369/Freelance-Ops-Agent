name: V2 CI

on:
  pull_request:
    paths:
      - "agent/**"
      - "backend/**"
      - "contracts/**"
      - "infra/**"
      - "docker-compose-infra.yaml"
      - "docker-compose.yaml"
      - ".github/workflows/v2-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "agent/**"
      - "backend/**"
      - "contracts/**"
      - "infra/**"
      - "docker-compose-infra.yaml"
      - "docker-compose.yaml"
      - ".github/workflows/v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy

  contracts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uvx --from openapi-spec-validator openapi-spec-validator contracts/openapi/agent-internal-api.yaml contracts/openapi/spring-tool-api.yaml
      - run: docker compose -f docker-compose-infra.yaml config
      - run: docker compose -f docker-compose.yaml config

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag freelance-ops-backend:ci backend
      - run: docker build --tag freelance-ops-agent:ci agent
