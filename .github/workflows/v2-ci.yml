name: V2 CI

on:
  pull_request:
    paths:
      - "agent/**"
      - "backend/**"
      - "contracts/**"
      - "frontend/**"
      - "infra/**"
      - "docker-compose-infra.yaml"
      - "docker-compose.yaml"
      - "docker-compose.production.yaml"
      - ".github/workflows/v2-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "agent/**"
      - "backend/**"
      - "contracts/**"
      - "frontend/**"
      - "infra/**"
      - "docker-compose-infra.yaml"
      - "docker-compose.yaml"
      - "docker-compose.production.yaml"
      - ".github/workflows/v2-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL: "1"
      VERCEL_ENV: preview
      VERCEL_URL: freelance-ops-ci-preview.example.invalid
      NEXT_PUBLIC_API_BASE_URL: https://spring-api.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run preview:check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew test --no-daemon

  agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: freelance_ops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelance_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --locked
      - name: Initialize Agent integration database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d freelance_ops -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE SCHEMA IF NOT EXISTS agent_runtime AUTHORIZATION postgres;"
      - run: uv run --locked pytest
        env:
          AGENT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/freelance_ops
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy

  contracts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
      - run: uvx --from openapi-spec-validator openapi-spec-validator contracts/openapi/agent-internal-api.yaml contracts/openapi/spring-tool-api.yaml
      - run: docker compose -f docker-compose-infra.yaml config
      - run: docker compose -f docker-compose.yaml config
      - run: docker compose -f docker-compose.yaml -f docker-compose.production.yaml config
        env:
          APP_DOMAIN: example.com
          BACKEND_IMAGE: example/backend
          AGENT_IMAGE: example/agent
          DEPLOY_IMAGE_TAG: ci
          APP_DB_PASSWORD: ci-app-password
          AGENT_DB_PASSWORD: ci-agent-password
          APP_AUTH_JWT_SECRET: ci-only-auth-secret-with-at-least-32-bytes
          AGENT_DELEGATION_TOKEN_PRIVATE_KEY: ci-private-key-placeholder
          AGENT_DELEGATION_TOKEN_PUBLIC_KEY: ci-public-key-placeholder
          AGENT_ROUTE_EVALUATOR_SYSTEM_PROMPT: ci-private-prompt-placeholder
          AGENT_ROUTE_EVALUATOR_PROMPT_VERSION: ci-v1
          AGENT_ROUTE_EVALUATOR_PROMPT_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag freelance-ops-backend:ci backend
      - run: docker build --tag freelance-ops-agent:ci agent
