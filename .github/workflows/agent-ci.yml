name: Agent CI

on:
  workflow_call:
  pull_request:
    paths:
      - "agent/**"
      - "sdk/python/**"
      - "contracts/**"
      - ".github/workflows/agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: freelance_ops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelance_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --locked
      - name: Initialize Agent integration database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -d freelance_ops -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE SCHEMA IF NOT EXISTS agent_runtime AUTHORIZATION postgres;"
      - name: Apply Agent runtime migrations
        run: uv run --locked alembic upgrade head
        env:
          AGENT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/freelance_ops
      - run: uv run --locked pytest
        env:
          AGENT_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/freelance_ops
      - name: Enforce pinned model release policy
        working-directory: ${{ github.workspace }}
        run: uv run --project agent --locked python agent/scripts/evaluation_gate.py --repository-root . --policy agent/evaluation/release-policy.json
      - name: Test Python platform SDK
        working-directory: ${{ github.workspace }}/sdk/python
        run: python -m unittest discover -s tests
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy

  image:
    name: Agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: freelance-ops-agent:ci
          cache-from: type=gha,scope=agent-ci
          cache-to: type=gha,mode=max,scope=agent-ci
