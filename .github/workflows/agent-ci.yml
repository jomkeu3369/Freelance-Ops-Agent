name: Agent CI

on:
  workflow_call:
  pull_request:
    paths:
      - "agent/**"
      - "sdk/python/**"
      - "contracts/**"
      - "infra/postgres/init/**"
      - ".github/workflows/agent-ci.yml"
      - ".github/scripts/verify_database_test_reports.py"
      - ".github/actions/deploy-service/**"
      - ".github/workflows/agent-cd.yml"
  workflow_dispatch:
    inputs:
      live_pet_quality:
        description: 운영 키로 합성 문의 품질 평가 실행 (고객 데이터 변경 없음, 최대 2.40 USD)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: freelance_ops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelance_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - name: 로컬 OCR 검사 의존성 설치
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor fonts-noto-cjk
      - name: OCR 실행 파일과 한글·영문 데이터 확인
        run: |
          command -v pdftoppm
          command -v pdftotext
          command -v tesseract
          tesseract --list-langs | grep -Fx eng
          tesseract --list-langs | grep -Fx kor
      - run: uv sync --locked
      - name: Agent 통합 검사 DB 초기화
        run: |
          docker exec -i -e APP_DB_PASSWORD=ci-app-password -e AGENT_DB_PASSWORD=ci-agent-password \
            ${{ job.services.postgres.id }} bash -s < ../infra/postgres/init/001-init.sh
      - name: Agent 실행 스키마 마이그레이션
        run: uv run --locked alembic upgrade head
        env:
          AGENT_DATABASE_URL: postgresql://agent_user:ci-agent-password@127.0.0.1:5432/freelance_ops
      - name: 단위·PostgreSQL·첨부파일 검사
        run: uv run --locked pytest -ra --junitxml=test-results/pytest.xml
        env:
          AGENT_INTEGRATION_DATABASE_URL: postgresql://agent_user:ci-agent-password@127.0.0.1:5432/freelance_ops
      - name: DB·첨부파일 필수 검사 실행 여부 확인
        if: always()
        run: python3 ../.github/scripts/verify_database_test_reports.py agent
      - name: Agent 검사 근거 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-reports-${{ github.sha }}
          path: agent/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: 고정 모델의 배포 기준 검사
        working-directory: ${{ github.workspace }}
        run: uv run --project agent --locked python agent/scripts/evaluation_gate.py --repository-root . --policy agent/evaluation/release-policy.json
      - name: Python SDK 검사
        working-directory: ${{ github.workspace }}/sdk/python
        run: python -m unittest discover -s tests
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy

  image:
    name: Agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: freelance-ops-agent:ci
          cache-from: type=gha,scope=agent-ci
          cache-to: type=gha,mode=max,scope=agent-ci

  live-pet-quality:
    name: 운영 키로 합성 문의 12종 평가
    if: github.event_name == 'workflow_dispatch' && inputs.live_pet_quality
    needs: [quality, image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    concurrency:
      group: v2-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 기존 운영 SSH 신뢰 설정
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VULTR_SSH_HOST_KEY }}
        run: bash .github/actions/deploy-service/ssh-trust.sh
      - name: 임시 평가 코드로 실행 후 정리
        env:
          DEPLOY_HOST: ${{ secrets.VULTR_HOST }}
          DEPLOY_USER: ${{ secrets.VULTR_USER }}
        run: bash .github/scripts/run_pet_quality_remote.sh
      - name: 실제 모델 평가 결과 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-quality-live-${{ github.sha }}
          path: pet-quality-live.json
          if-no-files-found: error
          retention-days: 14
