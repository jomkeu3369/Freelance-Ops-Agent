name: Agent CI

on:
  workflow_call:
  push:
    branches:
      - "codex/cloud-feature-integration-20261005"
  pull_request:
    paths:
      - "agent/**"
      - "sdk/python/**"
      - "contracts/**"
      - "infra/postgres/init/**"
      - ".github/workflows/agent-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: freelance_ops
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freelance_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install bounded local OCR test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor fonts-noto-cjk
      - name: Require native OCR executables and language data
        run: |
          command -v pdftoppm
          command -v pdftotext
          command -v tesseract
          tesseract --list-langs | grep -Fx eng
          tesseract --list-langs | grep -Fx kor
      - run: uv sync --locked
      - name: Initialize Agent integration database
        run: |
          docker exec -i -e APP_DB_PASSWORD=ci-app-password -e AGENT_DB_PASSWORD=ci-agent-password \
            ${{ job.services.postgres.id }} bash -s < ../infra/postgres/init/001-init.sh
      - name: Apply Agent runtime migrations
        run: uv run --locked alembic upgrade head
        env:
          AGENT_DATABASE_URL: postgresql://agent_user:ci-agent-password@127.0.0.1:5432/freelance_ops
      - name: Run unit, PostgreSQL and native attachment tests
        run: uv run --locked pytest -ra --junitxml=test-results/pytest.xml
        env:
          AGENT_INTEGRATION_DATABASE_URL: postgresql://agent_user:ci-agent-password@127.0.0.1:5432/freelance_ops
      - name: Require executed PostgreSQL and attachment suites without skips
        if: always()
        run: python3 ../.github/scripts/verify_database_test_reports.py agent
      - name: Preserve Agent test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-reports-${{ github.sha }}
          path: agent/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Enforce pinned model release policy
        working-directory: ${{ github.workspace }}
        run: uv run --project agent --locked python agent/scripts/evaluation_gate.py --repository-root . --policy agent/evaluation/release-policy.json
      - name: Test Python platform SDK
        working-directory: ${{ github.workspace }}/sdk/python
        run: python -m unittest discover -s tests
      - run: uv run --locked ruff check src tests
      - run: uv run --locked mypy

  image:
    name: Agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: false
          tags: freelance-ops-agent:ci
          cache-from: type=gha,scope=agent-ci
          cache-to: type=gha,mode=max,scope=agent-ci
