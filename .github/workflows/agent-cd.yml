name: Agent Production CD

on:
  workflow_call:
    inputs:
      image_tag:
        description: 변경 불가능한 agent 이미지 태그
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "변경 불가능한 agent 이미지 태그(예: agent-v2.0.0-rc1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/freelance-ops-agent:${{ inputs.image_tag }}
          cache-from: type=gha,scope=agent-cd
          cache-to: type=gha,mode=max,scope=agent-cd

  deploy:
    name: Deploy Agent
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: v2-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 서비스 공통 배포 실행
        uses: ./.github/actions/deploy-service
        with:
          service: agent
          image-tag: ${{ inputs.image_tag }}
          host: ${{ secrets.VULTR_HOST }}
          user: ${{ secrets.VULTR_USER }}
          ssh-private-key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          ssh-host-key: ${{ secrets.VULTR_SSH_HOST_KEY }}
          registry-user: ${{ secrets.GHCR_USERNAME }}
          registry-token: ${{ secrets.GHCR_TOKEN }}
