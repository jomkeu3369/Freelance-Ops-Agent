name: Backend Production CD

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Backend release tag such as backend-v2.0.0-rc1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/freelance-ops-backend:${{ inputs.image_tag }}
          cache-from: type=gha,scope=backend-cd
          cache-to: type=gha,mode=max,scope=backend-cd

  deploy:
    name: Deploy Backend
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: v2-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
          case "$IMAGE_TAG" in latest|dev|main|"") exit 2;; esac
      - name: Configure SSH trust
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.VULTR_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload deployment bundle
        env:
          DEPLOY_HOST: ${{ secrets.VULTR_HOST }}
          DEPLOY_USER: ${{ secrets.VULTR_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          RELEASE_DIR="/opt/freelance-ops/releases/backend/$IMAGE_TAG"
          tar -czf deployment.tgz docker-compose.yaml docker-compose.production.yaml infra/caddy infra/scripts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE_DIR'"
          scp deployment.tgz "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_DIR/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$RELEASE_DIR' && tar -xzf deployment.tgz"
      - name: Authenticate registry and deploy Backend
        env:
          DEPLOY_HOST: ${{ secrets.VULTR_HOST }}
          DEPLOY_USER: ${{ secrets.VULTR_USER }}
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          RELEASE_DIR="/opt/freelance-ops/releases/backend/$IMAGE_TAG"
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$RELEASE_DIR' && chmod +x infra/scripts/*.sh && DEPLOY_ROOT=/opt/freelance-ops ./infra/scripts/deploy-service.sh backend '$IMAGE_TAG'"
      - name: Verify public readiness
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
        run: curl --fail --silent --show-error "$PRODUCTION_BASE_URL/actuator/health/readiness"
