name: Production Auto CD

on:
  push:
    branches:
      - "main"
    paths:
      - "agent/**"
      - "backend/**"
      - "contracts/**"
      - "infra/**"
      - ".github/**"
      - "docker-compose-infra.yaml"
      - "docker-compose.yaml"
      - "docker-compose.production.yaml"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-auto-cd
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployment scope
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: 변경 경로별 검증·배포 범위 분류
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/deployment_scope.py --base "$BASE_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  automation-ci:
    uses: ./.github/workflows/actions-ci.yml

  agent-ci:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    uses: ./.github/workflows/agent-ci.yml

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  contracts-ci:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/contracts-compose-ci.yml

  deploy-agent:
    needs:
      - changes
      - automation-ci
      - agent-ci
      - backend-ci
      - contracts-ci
    if: >-
      always() &&
      needs.automation-ci.result == 'success' &&
      needs.changes.outputs.agent == 'true' &&
      needs.agent-ci.result == 'success' &&
      (needs.changes.outputs.backend != 'true' || needs.backend-ci.result == 'success') &&
      (needs.contracts-ci.result == 'success' || needs.contracts-ci.result == 'skipped')
    uses: ./.github/workflows/agent-cd.yml
    with:
      image_tag: agent-${{ github.sha }}
    secrets: inherit

  deploy-backend:
    needs:
      - changes
      - automation-ci
      - backend-ci
      - contracts-ci
      - deploy-agent
    if: >-
      always() &&
      needs.automation-ci.result == 'success' &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend-ci.result == 'success' &&
      (needs.contracts-ci.result == 'success' || needs.contracts-ci.result == 'skipped') &&
      (needs.changes.outputs.agent != 'true' || needs.deploy-agent.result == 'success')
    uses: ./.github/workflows/backend-cd.yml
    with:
      image_tag: backend-${{ github.sha }}
    secrets: inherit
