name: Backend CI

on:
  workflow_call:
  push:
    branches:
      - "codex/chat-composer-settings-20261006"
      - "codex/offline-flow-regressions-20261006"
      - "codex/partial-chat-history-20261006"
      - "codex/byok-release-integration-20261005"
      - "codex/cloud-feature-integration-20261005"
      - "codex/login-pet-motion-20261005"
      - "fix/bounded-byok-backend"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Spring tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test CI evidence gate
        run: python3 -m unittest discover -s ../.github/scripts -p 'test_*.py'
      - name: Require Docker for PostgreSQL integration tests
        run: docker info
      - name: Run all backend tests and Flyway migrations
        run: bash ./gradlew test --no-daemon --console=plain
      - name: Require executed PostgreSQL suites without skips
        if: always()
        run: python3 ../.github/scripts/verify_database_test_reports.py backend
      - name: Preserve backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: freelance-ops-backend:ci
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci
