name: Backend CI

on:
  workflow_call:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/verify_database_test_reports.py"
      - ".github/actions/deploy-service/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Spring tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: PostgreSQL 통합 검사용 Docker 확인
        run: docker info
      - name: Backend 전체 검사와 Flyway 마이그레이션
        run: bash ./gradlew test --no-daemon --console=plain
      - name: 필수 DB 검사 실행 여부 확인
        if: always()
        run: python3 ../.github/scripts/verify_database_test_reports.py backend
      - name: Backend 검사 근거 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: |
            backend/build/test-results/test/
            backend/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: freelance-ops-backend:ci
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci
