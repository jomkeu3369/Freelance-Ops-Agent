spring:
  application:
    name: freelance-ops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freelance_ops}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
app:
  environment: ${APP_ENVIRONMENT:development}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  auth:
    issuer: ${APP_AUTH_ISSUER:freelance-ops-backend}
    audience: ${APP_AUTH_AUDIENCE:freelance-ops-web}
    jwt-secret: ${APP_AUTH_JWT_SECRET:development-only-auth-secret-change-me}
    access-token-ttl-seconds: ${APP_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${APP_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    public-proposal-per-minute: ${APP_RATE_LIMIT_PUBLIC_PROPOSAL_PER_MINUTE:30}
    agent-per-minute: ${APP_RATE_LIMIT_AGENT_PER_MINUTE:20}
    max-entries: ${APP_RATE_LIMIT_MAX_ENTRIES:10000}
agent:
  quota:
    max-duration-seconds: ${AGENT_QUOTA_MAX_DURATION_SECONDS:180}
    max-model-calls: ${AGENT_QUOTA_MAX_MODEL_CALLS:50}
    max-tool-calls: ${AGENT_QUOTA_MAX_TOOL_CALLS:12}
    max-input-tokens: ${AGENT_QUOTA_MAX_INPUT_TOKENS:50000}
    max-output-tokens: ${AGENT_QUOTA_MAX_OUTPUT_TOKENS:48000}
    max-departments: ${AGENT_QUOTA_MAX_DEPARTMENTS:4}
    max-hierarchy-depth: ${AGENT_QUOTA_MAX_HIERARCHY_DEPTH:2}
    max-search-credits: ${AGENT_QUOTA_MAX_SEARCH_CREDITS:2}
    max-retries: ${AGENT_QUOTA_MAX_RETRIES:2}
    max-handoffs: ${AGENT_QUOTA_MAX_HANDOFFS:3}
  base-url: ${AGENT_BASE_URL:http://localhost:8000}
  delegation:
    issuer: ${AGENT_DELEGATION_TOKEN_ISSUER:freelance-ops-backend}
    agent-audience: ${AGENT_DELEGATION_TOKEN_AGENT_AUDIENCE:freelance-ops-agent}
    tool-audience: ${AGENT_DELEGATION_TOKEN_TOOL_AUDIENCE:freelance-ops-spring-tools}
    key-id: ${AGENT_DELEGATION_TOKEN_KEY_ID:freelance-ops-v1}
    previous-key-id: ${AGENT_DELEGATION_TOKEN_PREVIOUS_KEY_ID:}
    previous-public-key: ${AGENT_DELEGATION_TOKEN_PREVIOUS_PUBLIC_KEY:}
    ttl-seconds: ${AGENT_DELEGATION_TOKEN_TTL_SECONDS:60}
    private-key: ${AGENT_DELEGATION_TOKEN_PRIVATE_KEY:}
    public-key: ${AGENT_DELEGATION_TOKEN_PUBLIC_KEY:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  packages-to-scan: com.freelanceops.backend
  paths-to-match: /api/**

