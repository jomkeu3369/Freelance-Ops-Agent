spring:
  application:
    name: freelance-ops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/freelance_ops}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD:app_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
agent:
  base-url: ${AGENT_BASE_URL:http://localhost:8000}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  packages-to-scan: com.freelanceops.backend
  paths-to-match: /api/**

