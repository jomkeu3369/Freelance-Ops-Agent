[project]
name = "freelance-ops-agent-service"
version = "0.1.0"
description = "FastAPI and LangGraph runtime for Freelance Ops Agent V2"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.139.2",
    "langgraph==1.2.9",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1"
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "freelance_ops_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["freelance_ops_agent"]
