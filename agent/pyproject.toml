[project]
name = "freelance-ops-agent-service"
version = "0.1.0"
description = "FastAPI and LangGraph runtime for Freelance Ops Agent V2"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi==0.139.2",
    "httpx>=0.28,<1",
    "langchain[all]>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.3",
    "langgraph==1.2.9",
    "langsmith>=0.10,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "openai>=2.26,<3",
    "pypdf>=6,<7",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<1",
    "rank-bm25>=0.2.2",
    "deepagents>=0.7.5",
    "google-genai>=1.64,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "tavily>=1.1.0",
]

[project.optional-dependencies]
local-router = [
    "safetensors>=0.6,<1",
    "torch>=2.6,<3",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "joblib>=1.4,<2",
    "langgraph-cli[inmem]>=0.4.31",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "scikit-learn>=1.6,<2",
    "xgboost>=3,<4"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
extend-exclude = [
    "tests/model_test",
    "tests/유사도측정/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/runtime_predictor_prototype/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torch", "safetensors.*", "transformers"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*", "xgboost"]
ignore_missing_imports = true
