<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title description">
<title id="title">Compiled Supervisor LangGraph</title>
<desc id="description">Main orchestrator, requirements supervisor, risk supervisor, and final verifier with budget-exit paths.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
</defs>
<style>
svg { background: #0b1020; }
.node { stroke-width: 2; }
.stage { fill: #172033; stroke: #60a5fa; }
.terminal { fill: #132e2b; stroke: #34d399; }
.node-label { fill: #f8fafc; font: 600 18px ui-monospace, SFMono-Regular, Consolas, monospace; text-anchor: middle; }
.edge { fill: none; stroke: #64748b; stroke-width: 2.5; }
.conditional { stroke-dasharray: 8 6; }
.edge-label { fill: #fbbf24; font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
</style>
<path class="edge direct" d="M 370 99.0 L 370 151.0" marker-end="url(#arrow)"/>
<path class="edge conditional" d="M 535.0 180 L 650 180 L 650 620 L 535.0 620" marker-end="url(#arrow)"/>
<text class="edge-label" x="658" y="172">end</text>
<path class="edge conditional" d="M 370 209.0 L 370 261.0" marker-end="url(#arrow)"/>
<path class="edge conditional" d="M 535.0 290 L 740 290 L 740 620 L 535.0 620" marker-end="url(#arrow)"/>
<text class="edge-label" x="748" y="282">end</text>
<path class="edge conditional" d="M 370 319.0 L 370 371.0" marker-end="url(#arrow)"/>
<path class="edge conditional" d="M 535.0 400 L 830 400 L 830 620 L 535.0 620" marker-end="url(#arrow)"/>
<text class="edge-label" x="838" y="392">end</text>
<path class="edge conditional" d="M 370 429.0 L 370 481.0" marker-end="url(#arrow)"/>
<path class="edge direct" d="M 370 539.0 L 370 591.0" marker-end="url(#arrow)"/>
<rect class="node terminal" x="205.0" y="41.0" width="330" height="58" rx="16"/>
<text class="node-label" x="370" y="76">START</text>
<rect class="node stage" x="205.0" y="151.0" width="330" height="58" rx="16"/>
<text class="node-label" x="370" y="186">main_orchestrator</text>
<rect class="node stage" x="205.0" y="261.0" width="330" height="58" rx="16"/>
<text class="node-label" x="370" y="296">requirements_supervisor</text>
<rect class="node stage" x="205.0" y="371.0" width="330" height="58" rx="16"/>
<text class="node-label" x="370" y="406">risk_supervisor</text>
<rect class="node stage" x="205.0" y="481.0" width="330" height="58" rx="16"/>
<text class="node-label" x="370" y="516">final_verifier</text>
<rect class="node terminal" x="205.0" y="591.0" width="330" height="58" rx="16"/>
<text class="node-label" x="370" y="626">END</text>
</svg>
