    </mask>
    <linearGradient id="continuation-edge-y" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".075" stop-color="white" stop-opacity=".5" />
      <stop offset=".16" stop-color="white" stop-opacity="1" />
      <stop offset=".79" stop-color="white" stop-opacity="1" />
      <stop offset=".95" stop-color="white" stop-opacity=".12" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="continuation-edge-y-mask">
      <rect width="1440" height="760" fill="url(#continuation-edge-y)" />
    </mask>
  </defs>
