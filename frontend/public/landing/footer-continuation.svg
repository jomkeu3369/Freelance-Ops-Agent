<!-- Original Freelance Ops footer continuation. Same 22 strands and glow as footer-glow.svg; crop the unused lower 240px and bake a four-edge feather. No additional animated material. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs>
    <linearGradient id="thread">
      <stop stop-color="#879bdb" stop-opacity=".24" />
      <stop offset=".4" stop-color="#c99be8" stop-opacity=".78" />
      <stop offset=".68" stop-color="#f1d6ff" />
      <stop offset="1" stop-color="#9e78c9" stop-opacity=".12" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ddbbf6" stop-opacity=".4" />
      <stop offset=".42" stop-color="#ad83d0" stop-opacity=".16" />
      <stop offset="1" stop-color="#8f73aa" stop-opacity="0" />
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="25" />
    </filter>
    <linearGradient id="continuation-edge-x">
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".03" stop-color="white" stop-opacity=".16" />
      <stop offset=".10" stop-color="white" stop-opacity="1" />
      <stop offset=".88" stop-color="white" stop-opacity="1" />
      <stop offset=".98" stop-color="white" stop-opacity=".14" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
